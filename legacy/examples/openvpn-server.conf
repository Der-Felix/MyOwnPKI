###############################################################################
# examples/openvpn-server.conf - OpenVPN Gateway Server Certificate
#
# Intended Use:
#   OpenVPN Access Server or Community Edition server node.
#   Configured with preset "vpn-server" including serverAuth and IPsec OIDs.
#
# Issuance:
#   ./pki.sh batch examples/openvpn-server.conf
#
# OpenVPN Configuration snippet (server.conf):
#   ca          /etc/openvpn/server/ca.pem       (copy of ca-bundle.pem)
#   cert        /etc/openvpn/server/cert.pem     (copy of cert.pem)
#   key         /etc/openvpn/server/key.pem      (copy of key.pem, chmod 600)
#   extra-certs /etc/openvpn/server/chain.pem    (copy of chain.pem)
#   remote-cert-tls client
###############################################################################

PRESET="vpn-server"
NAME="openvpn-server"
CN="vpn.homelab.lan"
OU="Remote Access"

# Subject Alternative Names (DNS name & WAN / LAN IP of the VPN server)
DNS="vpn.homelab.lan, vpn.my-domain.example"
IP="192.168.1.1, 203.0.113.50"
EMAIL=""
URI=""

# Cryptography & CA
KEY="rsa3072"
DAYS="730"
CA="server-ca"
KEY_PASS="no"

# Exports
EXPORT_P12="no"
P12_LEGACY="no"
EXPORT_DER="no"
