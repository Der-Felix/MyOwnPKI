###############################################################################
# examples/hypervisor-nas.conf - Proxmox VE & TrueNAS Management Web UI
#
# Intended Use:
#   HTTPS Web Management GUI for Proxmox VE (PVE proxy), TrueNAS SCALE/CORE,
#   ESXi, pfSense/OPNsense WebGUI, or IPMI/iDRAC.
#
# Issuance:
#   ./pki.sh batch examples/hypervisor-nas.conf
#
# Proxmox VE Deployment:
#   scp fullchain.pem root@pve-node1:/etc/pve/local/pveproxy-ssl.pem
#   scp key.pem       root@pve-node1:/etc/pve/local/pveproxy-ssl.key
#   ssh root@pve-node1 'systemctl restart pveproxy'
###############################################################################

PRESET="server"
NAME="pve-node1"
CN="pve-node1.homelab.lan"
OU="Virtualization"

# SANs: Include FQDN, short hostname, and static IP addresses
DNS="pve-node1.homelab.lan, pve-node1, pve.homelab.lan"
IP="192.168.1.20, 10.0.10.20"
EMAIL=""
URI=""

# Cryptography & CA
KEY="rsa3072"
DAYS="397"
CA="server-ca"
KEY_PASS="no"

# Exports
EXPORT_P12="no"
P12_LEGACY="no"
EXPORT_DER="no"
