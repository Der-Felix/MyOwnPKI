###############################################################################
# examples/webserver.conf - Example Template for TLS Web Server / Reverse Proxy
#
# Intended Use:
#   Nginx, Traefik, Caddy, Apache HTTPD, or HAProxy reverse proxies.
#
# Issuance:
#   ./pki.sh batch examples/webserver.conf
###############################################################################

PRESET="server"
NAME="web01"
CN="web01.homelab.lan"
OU="Infrastructure"

# Subject Alternative Names (SANs)
DNS="web01.homelab.lan, web01, dashboard.homelab.lan"
IP="192.168.1.50, 10.0.0.50"
EMAIL=""
URI=""

# Cryptography & CA
KEY="rsa3072"
DAYS="397"
CA="server-ca"
KEY_PASS="no"

# Exports
EXPORT_P12="no"
P12_LEGACY="no"
EXPORT_DER="no"
