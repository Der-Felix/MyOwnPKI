###############################################################################
# examples/wildcard.conf - Wildcard TLS Certificate Template (*.domain + domain)
#
# Intended Use:
#   Covers all subdomains at a single level under your domain (e.g. *.homelab.lan
#   and homelab.lan) for central wildcard reverse proxies.
#
# Issuance:
#   ./pki.sh batch examples/wildcard.conf
###############################################################################

PRESET="wildcard"
NAME="wildcard-homelab"
CN="*.homelab.lan"
OU=""

# Wildcard + Base Domain
DNS="*.homelab.lan, homelab.lan"
IP="192.168.1.1"
EMAIL=""
URI=""

KEY="rsa3072"
DAYS="397"
CA="server-ca"
KEY_PASS="no"

EXPORT_P12="no"
P12_LEGACY="no"
EXPORT_DER="no"
