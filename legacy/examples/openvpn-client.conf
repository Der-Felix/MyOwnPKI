###############################################################################
# examples/openvpn-client.conf - OpenVPN Client Identity Certificate
#
# Intended Use:
#   Client identity certificate for connecting to an OpenVPN server.
#   Configured with preset "vpn-client" including clientAuth.
#
# Issuance:
#   ./pki.sh batch examples/openvpn-client.conf
#
# Client Configuration (.ovpn inline format):
#   <ca>
#   (contents of ca-bundle.pem)
#   </ca>
#   <cert>
#   (contents of cert.pem)
#   </cert>
#   <key>
#   (contents of key.pem)
#   </key>
###############################################################################

PRESET="vpn-client"
NAME="vpn-user-felix"
CN="felix-vpn-client"
OU="Remote Users"

# SANs (optional for VPN clients)
DNS=""
IP=""
EMAIL="felix@homelab.lan"
URI=""

# Cryptography & CA
KEY="rsa3072"
DAYS="730"
CA="client-ca"
KEY_PASS="no"

# Exports (generates .p12 for Windows OpenVPN GUI and mobile clients)
EXPORT_P12="yes"
P12_LEGACY="no"
EXPORT_DER="no"
