###############################################################################
# examples/smime-email.conf - S/MIME Email Signing and Encryption
#
# Intended Use:
#   Digitally signing and encrypting emails in Microsoft Outlook, Mozilla
#   Thunderbird, Apple Mail, and mobile clients.
#
# Issuance:
#   ./pki.sh batch examples/smime-email.conf
#
# Client Deployment:
#   Import the generated 'cert.p12' bundle into the email client or OS keychain.
###############################################################################

PRESET="smime"
NAME="smime-felix"
CN="Felix Administrator"
OU="Security"

# Subject Alternative Names (SANs) - Must contain recipient email address
DNS=""
IP=""
EMAIL="felix@homelab.lan, felix.admin@homelab.lan"
URI=""

# Cryptography & CA (RSA required for email encryption - Ed25519 cannot encrypt!)
KEY="rsa3072"
DAYS="730"
CA="client-ca"
KEY_PASS="no"

# Exports
EXPORT_P12="yes"
P12_LEGACY="no"
EXPORT_DER="no"
