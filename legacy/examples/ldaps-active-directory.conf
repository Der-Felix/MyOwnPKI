###############################################################################
# examples/ldaps-active-directory.conf - LDAPS & Active Directory Domain Controller
#
# Intended Use:
#   Secure LDAP (LDAPS on port 636) and Active Directory Domain Controllers
#   (Samba 4 AD DC or Microsoft Windows Server Active Directory).
#
# Issuance:
#   ./pki.sh batch examples/ldaps-active-directory.conf
#
# AD DC Requirement:
#   The certificate MUST include the domain controller FQDN, short NetBIOS name,
#   and forest root domain in SANs for Kerberos KDC / LDAPS to work seamlessly.
###############################################################################

PRESET="server"
NAME="dc01-ldaps"
CN="dc01.homelab.lan"
OU="Domain Controllers"

# SANs: FQDN, short NetBIOS name, domain name, and IP address
DNS="dc01.homelab.lan, dc01, homelab.lan"
IP="192.168.1.5, 10.0.0.5"
EMAIL=""
URI=""

# Cryptography & CA (RSA 3072/4096 required for AD Kerberos / Schannel)
KEY="rsa3072"
DAYS="397"
CA="server-ca"
KEY_PASS="no"

# Exports (cert.p12 for Windows Personal Certificate Store)
EXPORT_P12="yes"
P12_LEGACY="no"
EXPORT_DER="no"
