###############################################################################
# examples/ipsec-ikev2.conf - strongSwan / IPsec IKEv2 VPN Server
#
# Intended Use:
#   IPsec / IKEv2 server for native Windows, macOS, iOS, and Android VPN clients.
#   Configured with preset "vpn-server" including:
#     - serverAuth
#     - IPsec IKE Intermediate (1.3.6.1.5.5.8.2.2)
#     - IPsec End System (1.3.6.1.5.5.7.3.17)
#
# Issuance:
#   ./pki.sh batch examples/ipsec-ikev2.conf
#
# strongSwan Deployment (swanctl.conf):
#   cp cert.pem  /etc/swanctl/x509/vpn.pem
#   cp key.pem   /etc/swanctl/private/vpn.key
#   cp chain.pem /etc/swanctl/x509ca/server-ca.pem
#   cp root.pem  /etc/swanctl/x509ca/root.pem
###############################################################################

PRESET="vpn-server"
NAME="ipsec-ikev2-gateway"
CN="vpn.homelab.lan"
OU="VPN Infrastructure"

# SANs: Hostname & external IP reachable by IKEv2 clients
DNS="vpn.homelab.lan, ikev2.homelab.lan"
IP="192.168.1.1, 203.0.113.1"
EMAIL=""
URI=""

# Cryptography & CA
KEY="rsa3072"
DAYS="730"
CA="server-ca"
KEY_PASS="no"

# Exports
EXPORT_P12="yes"
P12_LEGACY="no"
EXPORT_DER="no"
