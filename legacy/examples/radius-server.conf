###############################################################################
# examples/radius-server.conf - RADIUS Server TLS Certificate
#
# Intended Use:
#   EAP-TLS / PEAP server termination on FreeRADIUS, UniFi Network Application,
#   or Windows Server NPS (Network Policy Server).
#
# Issuance:
#   ./pki.sh batch examples/radius-server.conf
#
# FreeRADIUS Deployment (e.g. /etc/freeradius/3.0/certs/):
#   private_key_file = /etc/freeradius/3.0/certs/radius01.key
#   certificate_file = /etc/freeradius/3.0/certs/radius01.pem   (fullchain.pem)
#   CA_file          = /etc/freeradius/3.0/certs/ca-bundle.pem  (ca-bundle.pem)
###############################################################################

PRESET="server"
NAME="radius01"
CN="radius01.homelab.lan"
OU="Network Infrastructure"

# Subject Alternative Names (SANs) - Must include RADIUS IP & hostnames
DNS="radius01.homelab.lan, radius01, radius.homelab.lan"
IP="192.168.1.10, 10.0.10.10"
EMAIL=""
URI=""

# Cryptography & CA (RSA recommended for broad legacy RADIUS supplicant support)
KEY="rsa3072"
DAYS="397"
CA="server-ca"
KEY_PASS="no"

# Exports
EXPORT_P12="yes"
P12_LEGACY="no"
EXPORT_DER="no"
