###############################################################################
# examples/network-auth-8021x.conf - 802.1X EAP-TLS Network Authentication
#
# Intended Use:
#   802.1X WiFi authentication (WPA2/WPA3 Enterprise) and wired network switch
#   port authentication (FreeRADIUS, UniFi, Cisco, MikroTik, Aruba).
#
# Issuance:
#   ./pki.sh batch examples/network-auth-8021x.conf
#
# Client Deployment:
#   - Windows/macOS/iOS/Android: Import 'cert.p12' into personal certificate store.
#   - Linux (wpa_supplicant / NetworkManager):
#       eap=TLS
#       identity="laptop-felix"
#       ca_cert="/path/to/publish/root.pem"
#       client_cert="/path/to/issued/laptop-felix-8021x/cert.pem"
#       private_key="/path/to/issued/laptop-felix-8021x/key.pem"
###############################################################################

PRESET="client"
NAME="laptop-felix-8021x"
CN="laptop-felix"
OU="Network Access"

# Subject Alternative Names (SANs)
DNS=""
IP=""
EMAIL="felix@homelab.lan"
URI=""

# Cryptography & CA
KEY="rsa3072"
DAYS="730"
CA="client-ca"
KEY_PASS="no"

# Automatic Exports (cert.p12 is required for Windows/macOS/iOS network profiles)
EXPORT_P12="yes"
P12_LEGACY="no"
EXPORT_DER="no"
