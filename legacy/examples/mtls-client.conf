###############################################################################
# examples/mtls-client.conf - mTLS Client Authentication & API Access
#
# Intended Use:
#   Mutual TLS client certificates for curl, REST APIs, Prometheus scraping,
#   browser administrative access, or SaltStack/Ansible automation runners.
#
# Issuance:
#   ./pki.sh batch examples/mtls-client.conf
###############################################################################

PRESET="client"
NAME="admin-client"
CN="admin-client"
OU="Operations"

# Subject Alternative Names (SANs)
DNS=""
IP=""
EMAIL="admin@homelab.lan"
URI=""

# Cryptography & CA
KEY="rsa3072"
DAYS="730"
CA="client-ca"
KEY_PASS="no"

# Generates cert.p12 bundle automatically for browsers and OS keychains
EXPORT_P12="yes"
P12_LEGACY="no"
EXPORT_DER="no"
