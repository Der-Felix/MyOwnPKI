###############################################################################
# examples/cluster-node.conf - Dual Server + Client Node (etcd / Salt / K8s)
#
# Intended Use:
#   Cluster members and distributed services that act both as TLS servers
#   and mutual TLS clients:
#     - etcd peer and server communication
#     - SaltStack master / minion encrypted transport
#     - Kubernetes control plane / kubelet
#     - PostgreSQL streaming replication peers
#     - RabbitMQ / EMQX MQTT clustered brokers
#
# Issuance:
#   ./pki.sh batch examples/cluster-node.conf
###############################################################################

PRESET="server-client"
NAME="cluster-node01"
CN="node01.cluster.homelab.lan"
OU="Cluster Nodes"

# SANs: Hostname, short name, and cluster internal IP addresses
DNS="node01.cluster.homelab.lan, node01, node01.local"
IP="10.240.0.11, 192.168.1.101"
EMAIL=""
URI="spiffe://homelab.lan/node/01"

# Cryptography & CA
KEY="rsa3072"
DAYS="397"
CA="server-ca"
KEY_PASS="no"

# Exports
EXPORT_P12="no"
P12_LEGACY="no"
EXPORT_DER="no"
