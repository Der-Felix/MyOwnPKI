###############################################################################
# examples/code-signing.conf - Code Signing for Scripts and Binaries
#
# Intended Use:
#   Digitally signing PowerShell scripts (.ps1), Windows executables (.exe/.dll),
#   Linux packages, or container signatures.
#
# Issuance:
#   ./pki.sh batch examples/code-signing.conf
#
# Signing in PowerShell:
#   $cert = Get-PfxCertificate -FilePath .\cert.p12
#   Set-AuthenticodeSignature -FilePath .\deploy.ps1 -Certificate $cert -HashAlgorithm SHA256
#
# Signing with osslsigncode (Linux):
#   osslsigncode sign -certs fullchain.pem -key key.pem -h sha256 -in app.exe -out app-signed.exe
###############################################################################

PRESET="codesign"
NAME="codesign-internal"
CN="Homelab Internal Code Signing"
OU="Release Engineering"

# SANs
DNS=""
IP=""
EMAIL=""
URI=""

# Cryptography & CA (RSA required for Microsoft Authenticode)
KEY="rsa3072"
DAYS="1095"
CA="server-ca"
KEY_PASS="no"

# Exports
EXPORT_P12="yes"
P12_LEGACY="no"
EXPORT_DER="no"
