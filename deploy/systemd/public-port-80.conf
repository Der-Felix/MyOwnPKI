# The old name (v0.2.1) of low-ports.conf – kept so installations and
# guides that use it keep working; install.sh installs low-ports.conf now
# and leaves an installed public-port-80.conf in place. Same content.
#
# Optional drop-in: the public listener on port 80 (and any other port
# below 1024) without a reverse proxy. The only capability the service
# ever gets: binding a port below 1024.

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
# A capability inside a private user namespace doesn't count for the host's
# network, so this case runs without one.
PrivateUsers=no
