# Optional drop-in: the public listener (CRLs, CA certificates) on port 80
# without a reverse proxy – public.listen: ":80" in the config. Installed by
# deploy/install.sh --public-port-80 to
# /etc/systemd/system/myownpki.service.d/public-port-80.conf.
#
# The only capability the service ever gets: binding a port below 1024.
# Without this file, use a port like :8080 behind a reverse proxy.

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
# A capability inside a private user namespace doesn't count for the host's
# network, so this case runs without one.
PrivateUsers=no
