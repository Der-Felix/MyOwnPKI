# Optional drop-in: listeners on ports below 1024 without a reverse proxy –
# the public listener on :80 (public.listen: ":80") and/or ACME with its own
# TLS on :443 (acme.listen: ":443" with acme.tls_issuer). Installed by
# deploy/install.sh --public-port-80 or --acme to
# /etc/systemd/system/myownpki.service.d/low-ports.conf.
#
# The only capability the service ever gets: binding a port below 1024.
# Without this file, use ports like :8080 behind a reverse proxy.
#
# The same as public-port-80.conf, its old name (v0.2.1): an installed
# public-port-80.conf keeps working, and install.sh keeps it.

[Service]
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
# A capability inside a private user namespace doesn't count for the host's
# network, so this case runs without one.
PrivateUsers=no
