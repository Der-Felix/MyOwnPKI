# MyOwnPKI server configuration – example (phase 1).
#
# Check a file with:   myownpki config check --config /etc/myownpki/config.yaml
#
# Every key can be overridden by an environment variable: the key path in upper
# case with "_" for ".", prefixed with MYOWNPKI_ – for example
# MYOWNPKI_ADMIN_LISTEN=0.0.0.0:9443. Unknown keys and unknown MYOWNPKI_*
# variables are errors, so a typo never goes unnoticed.
#
# Not configurable here, on purpose:
# - Dev mode: only the command-line flag `myownpki serve --dev`.
# - The unseal passphrase: it is entered at runtime and never stored in a file.

# Database files (system.db, tenants/<name>/…). Absolute path. Back it up with
# `myownpki backup`, and keep the unseal passphrase somewhere else.
data_dir: /var/lib/myownpki

log:
  # debug | info | warn | error
  level: info
  # json (for log collectors) | text (for reading on the console)
  format: json

# Admin listener: web UI and REST API.
admin:
  # IP:port – loopback by default. For remote administration use 0.0.0.0:9443
  # (IPv4) or [::]:9443 (IPv4 and IPv6), ideally behind a firewall or VPN.
  listen: 127.0.0.1:9443
  # Operator certificate (PEM). Leave both empty to get a self-signed bootstrap
  # certificate; its SHA-256 fingerprint is printed on the console at start.
  tls_cert_file: ""
  tls_key_file: ""
  # Further names in the bootstrap certificate (comma-separated DNS names or
  # IPs) – the names you type into the browser. Host name, the listen IP and
  # loopback are always in it. With tls_issuer: exactly the names of the
  # issued certificate.
  tls_names: ""
  # An intermediate CA of this instance (its name, e.g. issuing; not a root)
  # that issues the admin certificate: the server issues it itself while
  # unsealed (90 days at most, renewed at 2/3) and falls back to the bootstrap
  # certificate if it expires while sealed. Empty: tls_cert_file, or the
  # bootstrap certificate.
  tls_issuer: ""
  # Who may connect at all (IPs or CIDRs, comma-separated), checked before
  # TLS. Empty: everybody. Strongly recommended when listen is not loopback –
  # better still, never expose the admin listener to the internet.
  allowed_networks: ""

# Public listener: CRLs now, OCSP and ACME later. Must be reachable by every
# client that checks revocation. Empty disables it.
public:
  listen: ":8080"

# Sign-in to the admin listener.
auth:
  # Key that encrypts the TOTP secrets and keys the recovery code hashes,
  # created by `myownpki init`. Empty: <data_dir>/auth.key. It may live outside
  # the data directory (Docker secret, systemd credential) – then a copy of the
  # databases alone holds no usable TOTP secret. Whoever has the databases and
  # this file has both; `myownpki backup` includes it.
  key_file: ""
  # Reverse proxies whose X-Forwarded-For header is believed (IPs or CIDRs,
  # comma-separated), for example "10.0.0.5, 198.51.100.0/24". Empty: the
  # direct peer is the client. Never list networks that clients use.
  trusted_proxies: ""
  # The address users open the admin UI with, for example
  # https://pki.homelab.lan:9443. Passkeys are bound to its host name and work
  # only there. Empty: no passkeys, sign-in with an authenticator app (TOTP).
  passkey_origin: ""

# ACME server (certbot, acme.sh, Traefik, Caddy, lego). By default it runs
# behind a reverse proxy that terminates TLS; with tls_issuer it speaks TLS
# itself – see docs/OPERATIONS.md "ACME".
acme:
  # The address clients use, e.g. https://pki.homelab.lan/acme: the proxy's
  # https URL, or with tls_issuer this listener's. Every URL the server hands
  # out is built from it (X-Forwarded-Host/-Proto are never trusted). Empty:
  # ACME is off.
  base_url: ""
  # The ACME listener – never the public CRL port. Without tls_issuer plain
  # HTTP for the proxy only; with tls_issuer TLS for the clients, e.g. ":443"
  # (a port below 1024 needs the drop-in low-ports.conf).
  listen: 127.0.0.1:8081
  # Who may connect to acme.listen (IPs or CIDRs, comma-separated); others get
  # 403. Only their X-Forwarded-For is used as the client address. Ignored
  # with tls_issuer: every client connects directly.
  trusted_proxies: "127.0.0.1, ::1"
  # DNS server for dns-01 and for resolving http-01 names: the server that
  # knows your internal names (split DNS), e.g. 192.0.2.53. Empty: the
  # system resolver.
  resolver: ""
  # An intermediate CA of this instance (its name, e.g. issuing; not a root):
  # ACME speaks TLS itself on listen, with a certificate for the host of
  # base_url that the server issues from this CA while unsealed (90 days at
  # most, renewed at 2/3). Clients
  # connect directly; the client address is the peer. Empty: plain HTTP behind
  # a reverse proxy.
  tls_issuer: ""

# The agent listener (v0.3, docs/OPERATIONS.md "Agent"): myownpki-agent on the
# hosts connects here – Connect-RPC over mTLS, outbound from the host.
agent:
  # The address agents use, e.g. https://pki.homelab.lan:8444. Its host is
  # the name in the listener's certificate. Empty: no agent listener.
  base_url: ""
  # The agent listener – a port of its own (open it for the hosts).
  listen: ":8444"
  # An intermediate CA of this instance that issues the listener's
  # certificate while unsealed (like admin.tls_issuer). Required with base_url.
  tls_issuer: ""
  # The agent CA: an intermediate with the EKU limit clientAuth only. It
  # signs the agents' 7-day certificates; only those pass the listener's
  # client authentication. Required with base_url.
  ca: ""
