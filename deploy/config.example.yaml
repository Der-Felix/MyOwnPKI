# MyOwnPKI server configuration – example (phase 1).
#
# Check a file with:   myownpki config check --config /etc/myownpki/config.yaml
#
# Every key can be overridden by an environment variable: the key path in upper
# case with "_" for ".", prefixed with MYOWNPKI_ – for example
# MYOWNPKI_ADMIN_LISTEN=0.0.0.0:9443. Unknown keys and unknown MYOWNPKI_*
# variables are errors, so a typo never goes unnoticed.
#
# Not configurable here, on purpose:
# - Dev mode: only the command-line flag `myownpki serve --dev`.
# - The unseal passphrase: it is entered at runtime and never stored in a file.

# Database files (system.db, tenants/<name>/…). Absolute path. Back it up with
# `myownpki backup`, and keep the unseal passphrase somewhere else.
data_dir: /var/lib/myownpki

log:
  # debug | info | warn | error
  level: info
  # json (for log collectors) | text (for reading on the console)
  format: json

# Admin listener: web UI and REST API.
admin:
  # IP:port – loopback by default. For remote administration use 0.0.0.0:9443
  # (IPv4) or [::]:9443 (IPv4 and IPv6), ideally behind a firewall or VPN.
  listen: 127.0.0.1:9443
  # Operator certificate (PEM). Leave both empty to get a self-signed bootstrap
  # certificate; its SHA-256 fingerprint is printed on the console at start.
  tls_cert_file: ""
  tls_key_file: ""
  # Further names in the bootstrap certificate (comma-separated DNS names or
  # IPs) – the names you type into the browser. Host name, the listen IP and
  # loopback are always in it.
  tls_names: ""
  # Who may connect at all (IPs or CIDRs, comma-separated), checked before
  # TLS. Empty: everybody. Strongly recommended when listen is not loopback –
  # better still, never expose the admin listener to the internet.
  allowed_networks: ""

# Public listener: CRLs now, OCSP and ACME later. Must be reachable by every
# client that checks revocation. Empty disables it.
public:
  listen: ":8080"

# Sign-in to the admin listener.
auth:
  # Key that encrypts the TOTP secrets and keys the recovery code hashes,
  # created by `myownpki init`. Empty: <data_dir>/auth.key. It may live outside
  # the data directory (Docker secret, systemd credential) – then a copy of the
  # databases alone holds no usable TOTP secret. Whoever has the databases and
  # this file has both; `myownpki backup` includes it.
  key_file: ""
  # Reverse proxies whose X-Forwarded-For header is believed (IPs or CIDRs,
  # comma-separated), for example "10.0.0.5, 192.168.1.0/24". Empty: the
  # direct peer is the client. Never list networks that clients use.
  trusted_proxies: ""
