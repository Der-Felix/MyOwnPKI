# Task runner for MyOwnPKI – https://taskfile.dev
#
# Works the same in PowerShell, Git Bash, Linux, macOS and FreeBSD: Task runs every
# command in its own built-in POSIX shell (including rm, mkdir, …), so no Make,
# MSYS or WSL is needed. Run `task` to list all tasks.

version: '3'

vars:
  # Pinned tool versions – keep in sync with .github/workflows/ci.yml.
  # GO_VERSION must match the `go` line in go.mod (minimum and toolchain at once;
  # a `toolchain` line only appears when it is newer): with the default
  # GOTOOLCHAIN=auto, an older local Go downloads that toolchain by itself.
  # templ and govulncheck are pinned in go.mod (`go tool …`) and need no entry here.
  GO_VERSION: 1.27.3
  GOLANGCI_LINT_VERSION: 2.14.0
  # Prebuilt binary (not `go tool`): checked only once sqlc.yaml exists (phase 1).
  SQLC_VERSION: 1.31.1
  # Prebuilt binaries for lint:ci and lint:api (not part of `task check`).
  ACTIONLINT_VERSION: 1.7.12
  VACUUM_VERSION: 0.30.6
  # Release tools (release:check, release:snapshot) – keep in sync with .github/workflows/release.yml.
  GORELEASER_VERSION: 2.18.2
  SYFT_VERSION: 1.54.1
  # ACME test tools (task acme:lego, the conformance CI job) – never in go.mod.
  LEGO_VERSION: 5.5.2
  PEBBLE_VERSION: 2.10.1
  # The release the upgrade test starts from (task upgrade:test).
  UPGRADE_FROM: 0.1.0

  BIN_DIR: bin
  # Release targets (PLAN §3, go-conventions.md "Build and CI").
  PLATFORMS: linux/amd64 linux/arm64 darwin/arm64 windows/amd64 freebsd/amd64
  # -trimpath removes local paths (C:\Users\…) from the binaries: smaller,
  # reproducible, and no information about the build machine leaks.
  BUILD_FLAGS: -trimpath

# CGO: pure Go builds only (ADR-01); the HSM variant will get its own task.
# CGO_ENABLED is written directly in front of every go build/run/test command.
# A top-level `env:` block would NOT be enough: Task never overrides a variable
# that is already set in the environment, so a CGO_ENABLED=1 from the shell or
# the CI would silently win. `task build:verify` proves the result.

tasks:
  default:
    desc: List all tasks
    silent: true
    cmds:
      - task --list

  tools:check:
    desc: Verify that the installed Go, golangci-lint (and sqlc, once used) match the pinned versions
    silent: true
    cmds:
      - |
        v=$(go env GOVERSION)
        if [ "$v" != "go{{.GO_VERSION}}" ]; then
          echo "Go: found $v, expected go{{.GO_VERSION}} (GOTOOLCHAIN=$(go env GOTOOLCHAIN); needs 'auto' or go{{.GO_VERSION}})"
          exit 1
        fi
        echo "Go            $v  ok"
      - |
        v=$(golangci-lint version --short)
        if [ "$v" != "{{.GOLANGCI_LINT_VERSION}}" ]; then
          echo "golangci-lint: found $v, expected {{.GOLANGCI_LINT_VERSION}}"; exit 1
        fi
        echo "golangci-lint $v  ok"
      - |
        if [ -f sqlc.yaml ]; then
          v=$(sqlc version)
          if [ "$v" != "v{{.SQLC_VERSION}}" ]; then
            echo "sqlc: found $v, expected v{{.SQLC_VERSION}}"; exit 1
          fi
          echo "sqlc          $v  ok"
        fi
      - go tool templ version
      - go tool govulncheck -version

  build:
    desc: Build all three binaries for this machine into bin/ (pure Go, verified)
    cmds:
      - CGO_ENABLED=0 go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/ ./cmd/...
      - task: build:verify

  build:verify:
    desc: Fail if any binary in bin/ was built with CGO (ADR-01) – reads the build info of each file
    silent: true
    cmds:
      - |
        found=0
        for f in {{.BIN_DIR}}/* {{.BIN_DIR}}/*/*; do
          [ -f "$f" ] || continue
          found=1
          case "$(go version -m "$f")" in
            *"CGO_ENABLED=0"*) echo "pure Go      $f" ;;
            *) echo "CGO ENABLED  $f  – violates ADR-01 (pure Go builds)"; exit 1 ;;
          esac
        done
        if [ "$found" = 0 ]; then echo "no binaries in {{.BIN_DIR}}/"; exit 1; fi

  dev:
    desc: Run the server in dev mode (http://127.0.0.1:9443/design – no TLS, no login, loopback only)
    deps: [generate]
    cmds:
      - CGO_ENABLED=0 go run ./cmd/myownpki serve --dev

  screenshots:
    desc: Regenerate the README screenshots in docs/screenshots – at milestones only (browser via -- -browser PATH or MYOWNPKI_BROWSER)
    deps: [generate]
    cmds:
      - CGO_ENABLED=0 go run ./internal/tools/screenshots {{.CLI_ARGS}}

  cross:
    desc: Build all binaries for every release platform into bin/<os>-<arch>/ (pure Go, verified)
    cmds:
      - for: { var: PLATFORMS }
        cmd: >-
          CGO_ENABLED=0 GOOS={{index (splitList "/" .ITEM) 0}} GOARCH={{index (splitList "/" .ITEM) 1}}
          go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{replace "/" "-" .ITEM}}/ ./cmd/...
      - task: build:verify

  test:
    desc: Run all tests (pure Go, like the release binaries)
    cmds:
      - CGO_ENABLED=0 go test ./...

  fuzz:
    desc: Short fuzz runs of the parsers that read untrusted input (ACME JWS) – 30 seconds each
    cmds:
      - CGO_ENABLED=0 go test ./internal/acme/jose/ -run '^$' -fuzz FuzzParse -fuzztime {{.FUZZTIME | default "30s"}}

  acme:lego:
    desc: End-to-end check with the real ACME client lego (test tool, never in go.mod) – builds lego into .tools/ and runs the walking skeleton
    cmds:
      - GOFLAGS= CGO_ENABLED=0 GOBIN="{{.ROOT_DIR}}/.tools" go install github.com/go-acme/lego/v5@v{{.LEGO_VERSION}}
      - CGO_ENABLED=0 LEGO_BIN="{{.ROOT_DIR}}/.tools/lego{{exeExt}}" go test ./internal/acme/ -run 'TestLego' -count=1 -v

  upgrade:test:
    desc: Upgrade test – the previous release (UPGRADE_FROM) makes an instance and a backup; this build restores, migrates and issues by ACME
    cmds:
      - GOFLAGS= CGO_ENABLED=0 GOBIN="{{.ROOT_DIR}}/.tools/v{{.UPGRADE_FROM}}" go install github.com/Der-Felix/MyOwnPKI/cmd/myownpki@v{{.UPGRADE_FROM}}
      - CGO_ENABLED=0 UPGRADE_FROM_BIN="{{.ROOT_DIR}}/.tools/v{{.UPGRADE_FROM}}/myownpki{{exeExt}}" go test ./internal/acme/ -run 'TestUpgradeFrom' -count=1 -v

  acme:conformance:
    desc: ACME conformance with real clients (lego, certbot, acme.sh; Pebble as control) – Linux with Docker; CI runs it in its own job
    cmds:
      - LEGO_VERSION={{.LEGO_VERSION}} PEBBLE_VERSION={{.PEBBLE_VERSION}} bash test/conformance/run.sh

  test:race:
    desc: Run all tests with the race detector (needs CGO and a C compiler – runs in CI on Linux)
    cmds:
      - CGO_ENABLED=1 go test -race ./...

  fmt:
    desc: Format all Go files (gofmt + goimports, settings in .golangci.yml)
    cmds:
      - golangci-lint fmt ./...

  fmt:check:
    desc: Fail if any Go file is not formatted – shows the diff (run 'task fmt' to fix)
    cmds:
      - golangci-lint fmt --diff ./...

  lint:
    desc: Run golangci-lint (includes go vet; rules in .golangci.yml)
    cmds:
      - golangci-lint run ./...

  lint:ci:
    desc: Lint the GitHub Actions workflows with actionlint (run scripts with ShellCheck, if installed)
    cmds:
      - |
        v=$(actionlint -version | head -n 1)
        if [ "$v" != "{{.ACTIONLINT_VERSION}}" ]; then
          echo "actionlint: found '$v', expected {{.ACTIONLINT_VERSION}} (https://github.com/rhysd/actionlint/releases)"; exit 1
        fi
      - actionlint

  release:check:
    desc: Check .goreleaser.yaml with the pinned GoReleaser (needs goreleaser, see Taskfile.yml)
    cmds:
      - task: release:tools
      - goreleaser check

  release:snapshot:
    desc: Local release build into dist/ – archives, checksums, SBOMs; no signing, no image, nothing published (needs goreleaser and syft)
    cmds:
      - task: release:tools
      - |
        v=$(syft version | sed -n 's/^Version: *//p')
        if [ "$v" != "{{.SYFT_VERSION}}" ]; then
          echo "syft: found '$v', expected {{.SYFT_VERSION}} (https://github.com/anchore/syft/releases)"; exit 1
        fi
      - goreleaser release --snapshot --clean --skip=sign,docker

  release:tools:
    internal: true
    silent: true
    cmds:
      - |
        v=$(goreleaser --version 2>&1 | sed -n 's/^GitVersion: *//p')
        if [ "$v" != "{{.GORELEASER_VERSION}}" ]; then
          echo "goreleaser: found '$v', expected {{.GORELEASER_VERSION}} (https://github.com/goreleaser/goreleaser/releases)"; exit 1
        fi

  lint:api:
    desc: Lint api/openapi.yaml with vacuum (rules in api/vacuum.yaml; any warning fails)
    cmds:
      - |
        v=$(vacuum version)
        if [ "$v" != "{{.VACUUM_VERSION}}" ]; then
          echo "vacuum: found '$v', expected {{.VACUUM_VERSION}} (https://github.com/daveshanley/vacuum/releases)"; exit 1
        fi
      - vacuum lint --ruleset api/vacuum.yaml --fail-severity warn --no-banner api/openapi.yaml

  vuln:
    desc: Check dependencies and the Go standard library for known vulnerabilities (needs internet)
    cmds:
      - go tool govulncheck ./...

  generate:
    desc: Regenerate generated code (templ, sqlc)
    cmds:
      - go generate ./...

  generate:check:
    desc: Fail if generated code is out of date (regenerates, then checks git for changes)
    silent: true
    deps: [generate]
    cmds:
      - |
        changes=$(git status --porcelain)
        if [ -n "$changes" ]; then
          echo "Generated code is out of date or the tree is dirty – run 'task generate' and commit:"
          echo "$changes"; exit 1
        fi

  check:
    desc: Everything that must pass before a commit (vuln and generate:check run in CI)
    cmds:
      - task: tools:check
      - task: fmt:check
      - task: lint
      - task: test
      - task: build

  clean:
    desc: Remove build output
    cmds:
      - rm -rf {{.BIN_DIR}}
