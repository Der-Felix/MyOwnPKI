// The agent protocol (ADR-10, docs/PHASE3.md §2): Connect-RPC over mTLS on
// the agent listener. Every procedure is unary.
//
// Compatibility: fields and procedures are only ever added, never renumbered
// or removed – `buf breaking` checks it, so an older agent keeps working with
// a newer server. Everything an agent sends is attacker input on the server.
syntax = "proto3";

package myownpki.agent.v1;

option go_package = "github.com/Der-Felix/MyOwnPKI/internal/gen/myownpki/agent/v1;agentv1";

// AgentService is what the server offers to agents. Enroll and EnrollStatus
// are the only procedures that work without an agent certificate.
service AgentService {
  // Enroll starts an enrollment (ADR-18): the hostname, a CSR made on the
  // host, an optional join token. The answer carries the check token the
  // agent places for the server's http-01 check.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  // EnrollStatus runs the check once (check_ready) and reports the decision;
  // an admitted agent receives its certificate here.
  rpc EnrollStatus(EnrollStatusRequest) returns (EnrollStatusResponse);
  // RenewCertificate gives an agent a new certificate for a new key, over
  // its current certificate (renewed at 2/3 of its 7 days).
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);
  // RegisterACMEAccount binds this agent to its ACME account key before
  // newAccount. Repeating the same thumbprint is safe.
  rpc RegisterACMEAccount(RegisterACMEAccountRequest) returns (RegisterACMEAccountResponse);
  // Report sends bounded display data for this authenticated agent only.
  rpc Report(ReportRequest) returns (ReportResponse);
  // WatchDesiredState waits at most 50 seconds. No executable configuration
  // is ever delivered over this channel.
  rpc WatchDesiredState(WatchDesiredStateRequest) returns (WatchDesiredStateResponse);
}

// CheckMethod is how the agent answers the server's http-01 check.
enum CheckMethod {
  CHECK_METHOD_UNSPECIFIED = 0;
  // The agent listens on port 80 itself while the check runs.
  CHECK_METHOD_STANDALONE = 1;
  // The agent writes the file into the webroot of the web server on port 80.
  CHECK_METHOD_WEBROOT = 2;
}

message EnrollRequest {
  // The FQDN the agent claims and proves.
  string hostname = 1;
  // PKCS#10, DER. Only its public key and signature count; names and
  // extensions come from the server.
  bytes csr_der = 2;
  // Optional; never logged.
  string join_token = 3;
  CheckMethod check_method = 4;
  string agent_version = 5;
  string os = 6;
  string arch = 7;
}

message EnrollResponse {
  string enrollment_id = 1;
  // The agent's proof for EnrollStatus; the server keeps only its hash.
  string handle = 2;
  // The file name under /.well-known/acme-challenge/. Its content is
  // "<check_token>.<base64url(SHA-256 of the CSR's public key)>".
  string check_token = 3;
}

message EnrollStatusRequest {
  string enrollment_id = 1;
  string handle = 2;
  // true: the file is in place – run the check now (once per enrollment).
  bool check_ready = 3;
}

// EnrollState is where an enrollment stands.
enum EnrollState {
  ENROLL_STATE_UNSPECIFIED = 0;
  // Waiting for check_ready.
  ENROLL_STATE_WAITING_FOR_CHECK = 1;
  // In the approval queue of the web UI.
  ENROLL_STATE_PENDING_APPROVAL = 2;
  // Admitted, but the server is sealed: the certificate follows the unseal.
  ENROLL_STATE_WAITING_FOR_UNSEAL = 3;
  // Admitted; the certificate is in the answer.
  ENROLL_STATE_ADMITTED = 4;
  ENROLL_STATE_DENIED = 5;
  ENROLL_STATE_EXPIRED = 6;
}

message EnrollStatusResponse {
  EnrollState state = 1;
  // Why it waits or was refused, for the agent's log.
  string message = 2;
  string agent_id = 3;
  bool token_valid = 4;
  bool check_passed = 5;
  // With ENROLL_STATE_ADMITTED: the agent certificate (DER) and its chain,
  // the issuing CA first.
  bytes certificate_der = 6;
  repeated bytes chain_der = 7;
}

message RenewCertificateRequest {
  // PKCS#10, DER, for a new key made on the host (ADR-11).
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  bytes certificate_der = 1;
  repeated bytes chain_der = 2;
}

message RegisterACMEAccountRequest {
  // RFC 7638: base64url SHA-256 of the canonical public JWK.
  string key_thumbprint = 1;
}

message RegisterACMEAccountResponse {}

message DeploymentReport {
  string name = 1;
  string profile = 2;
  repeated string names = 3;
  string challenge = 4;
  string state = 5;
  string certificate_serial = 6;
  // Optional UTC RFC 3339 timestamps; the server uses its own receive time.
  string not_after = 7;
  string served_fingerprint = 8;
  string deployed_at = 9;
  string last_error = 10;
  // Echo the version only after handling this deployment's renew request.
  int64 handled_renewal_version = 11;
  // Leaf read back after the atomic write, used only when no TLS check exists.
  string written_fingerprint = 12;
  // When true, only served_fingerprint is accepted as deployment proof.
  bool check_configured = 13;
}

message ReportRequest {
  string agent_version = 1;
  string os = 2;
  string arch = 3;
  repeated DeploymentReport deployments = 4;
  // Installed package format: deb, rpm or tarball. Empty means a legacy tarball.
  string package_format = 5;
}

message ReportResponse {}

message WatchDesiredStateRequest {
  int64 known_version = 1;
}

message DesiredDeployment {
  string name = 1;
  string renew_requested_at = 2;
  int64 renewal_version = 3;
}

message WatchDesiredStateResponse {
  int64 version = 1;
  bool changed = 2;
  repeated string allowed_names = 3;
  repeated DesiredDeployment deployments = 4;
}
