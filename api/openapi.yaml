openapi: 3.1.0
info:
  title: MyOwnPKI Admin API
  version: 0.2.0
  summary: REST API of the MyOwnPKI admin listener (v0.2)
  description: |
    v0.1 (docs/PLAN.md §10): CAs, certificates, presets, upload/download, revocation, legacy
    import, login with mandatory second factor, RBAC, unseal and audit log. v0.2 adds the ACME
    domains and the ACME rate limits in the tenant settings. The ACME protocol itself (RFC 8555)
    is not part of this API: it is served on its own listener, behind a reverse proxy that ends
    TLS. Agents (phase 3) follow later.

    **Conventions**
    - Served only on the admin listener (ADR-08), base path `/api/v1`. The listener's own
      `GET /healthz` (outside the API) is the only health check.
    - JSON with `snake_case` fields; times are RFC 3339 in UTC; serial numbers and
      fingerprints are upper-case hex without separators.
    - Requests with a body must send `Content-Type: application/json` (otherwise 415); unknown
      fields and trailing data are refused (400). Bodies are limited to 128 KiB (413).
    - Errors use RFC 9457 `application/problem+json`. Problem `type` values are URNs
      (`urn:myownpki:problem:<name>`), listed in the `Problem` schema. Every response carries
      `X-Request-ID`; problems repeat it as `request_id`.
    - Authentication: a browser session (cookie `__Host-myownpki_session` + `X-CSRF-Token` header
      on state-changing requests) **or**, from step 18, an API token (`Authorization: Bearer`).
      The tenant always comes from the authenticated context, never from a request parameter.
    - `x-required-role` names who may call an operation: `none` (public), `signed-in` (any
      signed-in user), `instance-admin`, or the minimum tenant role (`viewer` < `operator` <
      `admin`) within the scope of the target object. The service layer enforces it, not only
      the handler.
    - Objects the caller may not read answer **404**, like unknown IDs – nobody can probe what
      exists. Whoever may read an object but lacks the role for an action gets **403**.
    - `x-step-up: true` means a fresh second factor is required (see `POST /auth/step-up`);
      otherwise the request fails with `403` and problem type `step-up-required`. An **API token**
      never satisfies step-up: it gets `403` with problem type `forbidden` ("an API token can't
      … – sign in and confirm with a fresh code"), since no step-up can ever make a token fresh.
    - `x-passive: true`: the request doesn't count as activity – polling it doesn't keep a
      session alive past its idle timeout (decided by the route, not by the client).
    - Lists use cursor pagination: `limit` (at most 100) + `cursor`, response field `next_cursor`.
    - Certificate issuance through this API runs through the same policy engine as the
      ACME server of phase 2 (ADR-19). Extensions always come from the preset, never from a CSR.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /api/v1
    description: Admin listener (default port 9443)

security:
  - session: []
    csrf: []
  - bearer: []

tags:
  - name: system
    description: Status, seal/unseal
  - name: auth
    description: Login, second factor, step-up, session
  - name: users
    description: Local users, roles, second-factor enrollment
  - name: tokens
    description: API tokens
  - name: settings
    description: Tenant settings (server key generation, subject defaults)
  - name: domains
    description: Name spaces ACME issues for (CA, challenges, approval level)
  - name: presets
    description: Certificate presets (read-only, built in)
  - name: cas
    description: Root and intermediate certificate authorities
  - name: certificates
    description: Issue, inspect, download, revoke and renew certificates
  - name: imports
    description: Import of a legacy pki.sh directory and of external certificates
  - name: audit
    description: Tamper-evident audit log

paths:
  # ---------------------------------------------------------------- system
  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Version, seal state and server time
      description: Polled by the UI; it doesn't keep the session alive.
      x-required-role: signed-in
      x-passive: true
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/unseal:
    post:
      tags: [system]
      operationId: unseal
      summary: Unlock the encrypted CA keys
      description: |
        The server starts sealed: online CA keys are stored encrypted and no signing is possible.
        The passphrase derives the key-encryption key (Argon2id); the decrypted keys stay in memory
        only. A signed-in instance admin plus the passphrase – the passphrase is the stronger
        proof, so no step-up. Wrong passphrases are slowed down per instance and per client
        address (three free, then 1 minute doubling up to 1 hour); every attempt is audited and a
        success resets the instance and that address.
      x-required-role: instance-admin
      requestBody:
        description: "The unseal passphrase"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnsealRequest" }
      responses:
        "200":
          description: Unsealed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /system/seal:
    post:
      tags: [system]
      operationId: seal
      summary: Remove all CA keys from memory immediately
      description: Emergency stop. Signing stops until the next unseal. Sealing a sealed server does nothing.
      x-required-role: instance-admin
      responses:
        "200":
          description: Sealed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: First factor (username + password)
      description: |
        On success the session cookie holds a **pending** session: valid for 5 minutes and only
        for `/auth/totp`. Works while the server is sealed (the second factor is encrypted with
        the auth key, not the unseal key). Throttled before any hash is computed; repeated
        failures lock the account for a while. A browser that completed a sign-in before brings
        its device cookie (`__Host-myownpki_device`) and is judged by its own counter instead.
      security: []
      x-required-role: none
      requestBody:
        description: "Username and password (first factor)"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Password accepted, second factor required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Busy" }

  /auth/totp:
    post:
      tags: [auth]
      operationId: verifyTOTP
      summary: Second factor with a TOTP code (or a recovery code)
      description: |
        Needs the pending session of `/auth/login`. Failures count in the same throttle and
        lockout as wrong passwords. A wrong code answers 422 `wrong-secret` (the pending session
        stays – type it again); 401 means the pending session is missing or over – sign in again.
        On success the pending session ends and a **new** session ID
        is set (no session fixation), together with a renewed device cookie (one year).
      security: []
      x-required-role: none
      requestBody:
        description: "TOTP code from the authenticator app, or a recovery code"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPRequest" }
      responses:
        "200":
          description: Signed in; session cookie set with a new ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/webauthn/begin:
    post:
      tags: [auth]
      operationId: beginWebAuthnLogin
      summary: Start a passkey/WebAuthn assertion (second factor or step-up)
      description: |
        With the pending session of `POST /auth/login` this is the second factor; with a full session
        it is a step-up. The options go unchanged to `navigator.credentials.get()`. Passkeys need
        `auth.passkey_origin` in the configuration (otherwise 404) and a registered passkey (otherwise 409).
      security: []
      x-required-role: none
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions for navigator.credentials.get()
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/webauthn/finish:
    post:
      tags: [auth]
      operationId: finishWebAuthnLogin
      summary: Complete the WebAuthn assertion
      description: |
        After the password: a new session ID and a device cookie, as after a TOTP code. Signed in: the
        step-up time is refreshed. A refused assertion counts like a wrong code (throttle, lockout).
      security: []
      x-required-role: none
      requestBody:
        description: "Assertion returned by navigator.credentials.get()"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "200":
          description: Logged in (or step-up refreshed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/step-up:
    post:
      tags: [auth]
      operationId: stepUp
      summary: Confirm the second factor again for a sensitive action
      description: |
        Refreshes `step_up_valid_until` of the current session (5 minutes). TOTP only – recovery
        codes are for signing in. For WebAuthn, use `/auth/webauthn/begin` + `/auth/webauthn/finish`
        while signed in instead (step 17).
      x-required-role: signed-in
      requestBody:
        description: "A fresh TOTP code"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpRequest" }
      responses:
        "200":
          description: Step-up valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current user, roles and session state
      description: Doesn't keep the session alive (the UI polls it for the idle countdown).
      x-required-role: signed-in
      x-passive: true
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session (server-side)
      description: The device cookie stays – the browser remains a known device.
      x-required-role: signed-in
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- users
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List the users (instance admins)
      x-required-role: instance-admin
      responses:
        "200":
          description: Users, no secrets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user with password and second factor
      description: |
        The TOTP secret is fixed now (security.md): the answer has the otpauth link, the secret and
        the recovery codes **once** – hand them to the user, whose first sign-in confirms the
        secret. Roles are for this tenant; a CA scope names the CA by ID.
      x-required-role: instance-admin
      x-step-up: true
      requestBody:
        description: "The new user"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /users/{userId}:
    parameters:
      - name: userId
        description: "ID of the user"
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      x-required-role: instance-admin
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Disable, enable or unlock a user
      description: Nobody disables themselves; the last active admins stay. Disabling ends every session.
      x-required-role: instance-admin
      x-step-up: true
      requestBody:
        description: "What to change"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The user after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Disable a user (users are never deleted)
      description: "The ID stays in the audit log; the same as PATCH with disabled true."
      x-required-role: instance-admin
      x-step-up: true
      responses:
        "204": { description: Disabled }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /users/{userId}/roles:
    parameters:
      - name: userId
        description: "ID of the user"
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    put:
      tags: [users]
      operationId: setUserRoles
      summary: Replace the roles of a user in this tenant
      description: New rights only with a new session – the user's sessions end.
      x-required-role: instance-admin
      x-step-up: true
      requestBody:
        description: "Every role the user shall have in this tenant"
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              additionalProperties: false
              properties:
                roles:
                  type: array
                  items: { $ref: "#/components/schemas/RoleBinding" }
      responses:
        "200":
          description: The user after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /users/me/password:
    put:
      tags: [users]
      operationId: changeOwnPassword
      summary: Change the own password
      x-required-role: signed-in
      x-step-up: true
      requestBody:
        description: "Current and new password"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Changed; other sessions of the user are ended }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/me/totp:
    post:
      tags: [users]
      operationId: beginTOTPEnrollment
      summary: Start changing the own authenticator app (returns the new secret once)
      description: Needs the current password; the old secret works until the new one is confirmed.
      x-required-role: signed-in
      requestBody:
        description: "The current password"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPassword" }
      responses:
        "200":
          description: Secret for the authenticator app – shown only now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrollment" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/me/totp/confirm:
    post:
      tags: [users]
      operationId: confirmTOTPEnrollment
      summary: Confirm the new authenticator with a first code
      description: The other sessions of the user end; device cookies become void.
      x-required-role: signed-in
      requestBody:
        description: "A code from the new authenticator"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPRequest" }
      responses:
        "204": { description: The new authenticator is active }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/me/recovery-codes:
    post:
      tags: [users]
      operationId: newRecoveryCodes
      summary: Replace the own recovery codes (shown once)
      x-required-role: signed-in
      requestBody:
        description: "The current password"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPassword" }
      responses:
        "200":
          description: The new codes; the old ones stop working
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/me/webauthn:
    get:
      tags: [users]
      operationId: listWebAuthnCredentials
      summary: List the own passkeys
      x-required-role: signed-in
      responses:
        "200":
          description: The own passkeys (no key material)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebAuthnPasskey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/webauthn/begin:
    post:
      tags: [users]
      operationId: beginWebAuthnRegistration
      summary: Start registering a passkey / security key
      description: |
        Needs a fresh step-up **and** the current password (a new second factor is never added with
        the session alone). User verification is required (PIN or biometrics), attestation is not
        asked for. At most 10 passkeys per user.
      x-required-role: signed-in
      x-step-up: true
      requestBody:
        description: "The current password"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPassword" }
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions for navigator.credentials.create()
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/me/webauthn/finish:
    post:
      tags: [users]
      operationId: finishWebAuthnRegistration
      summary: Complete passkey registration
      description: |
        Stores the passkey. Every device cookie of the user becomes void and the other sessions end,
        as for every new authenticator.
      x-required-role: signed-in
      parameters:
        - name: name
          in: query
          required: false
          description: "A name to recognize the passkey by (at most 64 characters; default Passkey)"
          schema: { type: string, maxLength: 64 }
      requestBody:
        description: "Attestation returned by navigator.credentials.create()"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnPasskey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /users/me/webauthn/{passkeyId}/remove:
    post:
      tags: [users]
      operationId: deleteWebAuthnCredential
      summary: Remove an own passkey
      x-required-role: signed-in
      x-step-up: true
      parameters:
        - name: passkeyId
          description: "ID of the passkey"
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        description: "The current password"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPassword" }
      responses:
        "204": { description: Removed; device cookies of the user are void }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------- tokens
  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List the own API tokens (never the secret)
      x-required-role: signed-in
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Token" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create an API token (the secret is shown once)
      description: |
        A token carries roles its owner has (never more) and ends within one year. Use it as
        `Authorization: Bearer mop_…`. **A token never satisfies step-up**: revocation, key
        downloads, CA and user management need a person with a fresh second factor. Such a
        request answers `403` `forbidden` (not `step-up-required`).
      x-required-role: signed-in
      x-step-up: true
      requestBody:
        description: "Name, roles and end of the token"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenCreate" }
      responses:
        "201":
          description: Created – the secret is in this answer only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /tokens/{tokenId}:
    parameters:
      - name: tokenId
        description: "ID of the token"
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke an own API token – it stops working at once
      x-required-role: signed-in
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: Settings of this tenant
      x-required-role: viewer
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [settings]
      operationId: updateSettings
      summary: Change the settings of this tenant
      description: |
        `allow_server_keygen` switches server-side key generation (a CSR is always possible);
        the subject defaults fill fields that neither the request nor the CSR gives (like
        pki.conf of pki.sh) – never the common name.
        `acme_limits` (since 0.2, optional here) are the rate limits of the ACME server.
      x-required-role: admin
      requestBody:
        description: "The settings"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantSettings" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  # ---------------------------------------------------------------- presets
  /domains:
    get:
      tags: [domains]
      operationId: listDomains
      summary: List the domains ACME issues for
      description: Only domains whose CA the caller may read; by name.
      x-required-role: viewer
      responses:
        "200":
          description: Domains
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Domain" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [domains]
      operationId: createDomain
      summary: Create a domain
      description: |
        A name space ACME issues for: the signing CA (an intermediate whose name constraints permit
        the domain), the challenges that prove control, the approval level, preset and validity.
        Absent settings take the defaults: sub-domains included, no wildcards, http-01 and dns-01,
        approval `account`, preset `server`, 90 days, address policy `internal`.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "Name, CA and optional settings"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainCreate" }
      responses:
        "201":
          description: Created
          headers:
            Location:
              description: URL of the new domain
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /domains/{domainId}:
    parameters:
      - $ref: "#/components/parameters/DomainId"
    get:
      tags: [domains]
      operationId: getDomain
      summary: Get a domain
      x-required-role: viewer
      responses:
        "200":
          description: Domain
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [domains]
      operationId: updateDomain
      summary: Change a domain's settings
      description: The name never changes. Absent fields keep their value.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The settings to change"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DomainUpdate" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
    delete:
      tags: [domains]
      operationId: deleteDomain
      summary: Delete a domain
      description: |
        Issued certificates stay. Open ACME orders for its names fail at finalize, which checks the
        domain again.
      x-required-role: admin
      x-step-up: true
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /presets:
    get:
      tags: [presets]
      operationId: listPresets
      summary: List the certificate presets
      description: Built in and the same for everybody, so any signed-in user may read them.
      x-required-role: signed-in
      responses:
        "200":
          description: Presets, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Preset" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /presets/{presetName}:
    get:
      tags: [presets]
      operationId: getPreset
      summary: Get one preset
      x-required-role: signed-in
      parameters:
        - name: presetName
          description: "Preset name, for example `server`"
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
      responses:
        "200":
          description: Preset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- CAs
  /cas:
    get:
      tags: [cas]
      operationId: listCAs
      summary: List certificate authorities
      x-required-role: viewer
      responses:
        "200":
          description: CAs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CA" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [cas]
      operationId: createCA
      summary: Create a root or intermediate CA
      description: |
        - `kind: intermediate` with `parent_ca_id`: signed at once when the parent's key is on this
          server; below an offline root only key and CSR are created – the answer has the bundle
          for the offline root (`offline_signing`), the certificate comes back with
          `PUT /cas/{caId}/certificate`.
        - `kind: root`: an online root (for tests and homelab); the answer warns. Prefer an offline
          root (`POST /cas/import`). A root signs intermediates and CRLs only (decision 81).
        `public_base_url` is baked into every certificate (AIA, CRL DP) and can never change once
        used; a non-standard port or https gets a warning.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The CA to create"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CACreate" }
      responses:
        "201":
          description: CA created (or waiting for its offline signature)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }

  /cas/import:
    post:
      tags: [cas]
      operationId: importCA
      summary: Import the certificate of an offline root
      description: |
        The root's key stays offline (legacy `pki.sh`, an air-gapped machine); the server uses the
        certificate for chains and to check the root's uploaded CRLs. A known offline root with a
        new key and the same name gets its next generation. Compare the SHA-256 fingerprint in
        the notes with the one the offline root shows. A whole pki.sh directory is imported with
        `POST /imports/legacy`.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The root certificate"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAImport" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /cas/{caId}:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      tags: [cas]
      operationId: getCA
      summary: Get a CA
      x-required-role: viewer
      responses:
        "200":
          description: CA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [cas]
      operationId: updateCA
      summary: Change the CRL lifetime or the maximum certificate validity
      description: Name and base URL never change – they are inside certificates already.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The limits to change (at least one)"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CAUpdate" }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /cas/{caId}/renew:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      tags: [cas]
      operationId: renewCA
      summary: Renew a CA with a new key (the next generation)
      description: |
        The new generation signs from now on; the old one keeps its CRL for what it signed. Below
        an offline root the answer has the offline bundle, as at creation. An offline root is
        renewed by importing its new certificate under the same name (`POST /cas/import`).
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "Optional key algorithm and validity"
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CARenew" }
      responses:
        "200":
          description: Renewed (or waiting for the offline signature)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }

  /cas/{caId}/retire:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      tags: [cas]
      operationId: retireCA
      summary: Retire a CA – it signs no new certificates, its CRLs go on
      x-required-role: admin
      x-step-up: true
      responses:
        "200":
          description: Retired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAChange" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /cas/{caId}/revoke:
    parameters:
      - $ref: "#/components/parameters/CAId"
    post:
      tags: [cas]
      operationId: revokeCA
      summary: Revoke an intermediate CA (irreversible)
      description: |
        Revoked on the CRL of its parent; whoever manages the parent revokes. A root can't be
        revoked – remove it from the trust stores. A CA below an offline root is revoked on the
        offline root (its next CRL upload).
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "Reason, optional generation and invalidity date"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CARevoke" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CARevocationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /cas/{caId}/certificate:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      tags: [cas]
      operationId: downloadCACertificate
      summary: Download the CA certificate
      x-required-role: viewer
      parameters:
        - name: format
          description: "`pem` = CA certificate, `der` = binary, `chain` = this CA and its issuers up to the root (for trust stores; a server sends `fullchain` of its certificate instead)"
          in: query
          schema:
            type: string
            enum: [pem, der, chain]
            default: pem
      responses:
        "200":
          description: Certificate (chain = this CA and its issuers up to the root)
          content:
            application/pem-certificate-chain:
              schema: { type: string }
            application/pkix-cert:
              schema: { type: string, contentEncoding: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cas]
      operationId: uploadSignedCACertificate
      summary: Upload the certificate of an offline-signed intermediate
      description: |
        Checked against what was ordered (key, subject, CA:TRUE, key usage, path length, name
        constraints, EKU, signature of exactly the parent generation, no SHA-1). The CA becomes
        active and signs its first CRL at once.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The certificate signed by the offline root"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignedCAUpload" }
      responses:
        "200":
          description: CA is active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CAChange" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }

  /cas/{caId}/csr:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      tags: [cas]
      operationId: downloadCACSR
      summary: The offline signing bundle of a CA that waits for its signature
      description: |
        The CSR, the OpenSSL extension file to sign it with (never the CSR's extensions), the days,
        digest and serial, and the instructions for `pki ca-sign` and plain OpenSSL.
      x-required-role: admin
      responses:
        "200":
          description: Offline signing bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfflineBundle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /cas/{caId}/crl:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      tags: [cas]
      operationId: downloadCRL
      summary: Download the current CRL (also served on the public listener)
      x-required-role: viewer
      parameters:
        - name: format
          description: "`der` = binary (as served to clients), `pem` = text"
          in: query
          schema:
            type: string
            enum: [der, pem]
            default: der
      responses:
        "200":
          description: Certificate revocation list
          content:
            application/pkix-crl:
              schema: { type: string, contentEncoding: binary }
            application/x-pem-file:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
    post:
      tags: [cas]
      operationId: regenerateCRL
      summary: Sign a new CRL now (CRL number + 1)
      x-required-role: admin
      x-step-up: true
      responses:
        "200":
          description: The new CRL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRLSigned" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }
    put:
      tags: [cas]
      operationId: uploadCRL
      summary: Upload the CRL an offline root signed
      description: |
        Checked: signed by exactly that root generation, CRL number strictly increasing,
        thisUpdate not in the future, nextUpdate in the future, at most 4 MiB. Intermediates the
        CRL lists are marked revoked.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The CRL in PEM"
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [crl_pem]
              additionalProperties: false
              properties:
                crl_pem: { type: string, maxLength: 6291456, description: "PEM of a CRL of at most 4 MiB" }
      responses:
        "200":
          description: Stored and served
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRLUploaded" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  # ---------------------------------------------------------------- certificates
  /certificates:
    get:
      tags: [certificates]
      operationId: listCertificates
      summary: List certificates
      description: Only certificates of CAs the caller may read; newest first.
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: ca_id
          description: "Only certificates issued by this CA (404 if the caller may not read it)"
          in: query
          schema: { $ref: "#/components/schemas/ID" }
        - name: status
          description: "Only certificates with this status"
          in: query
          schema: { $ref: "#/components/schemas/CertificateStatus" }
        - name: preset
          description: "Only certificates issued with this preset"
          in: query
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
        - name: expires_before
          in: query
          description: Only certificates whose notAfter is before this time
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: |
            Part of the CN, a SAN or the serial number, any case. A plain substring – `%` and `_`
            are ordinary characters, not wildcards.
          schema: { type: string, maxLength: 253 }
      responses:
        "200":
          description: Certificates, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [certificates]
      operationId: issueCertificate
      summary: Issue a certificate from a CSR or with a server-generated key
      description: |
        Exactly one of `csr_pem` or `key` must be given.
        - With a CSR (preferred): the private key never leaves the requester. Only the names are
          taken from the CSR (unless `use_csr_sans` is false); extensions come from the preset.
        - With `key`: the server generates the key and stores it encrypted, so it can be
          downloaded later (step-up + audit) – the legacy pki.sh workflow; only if the tenant
          allows server-side keys.
        Names are checked against the CA's name constraints before signing. Needs an unsealed
        server (503 `sealed` otherwise).
      x-required-role: operator
      requestBody:
        description: "CA, preset and names, plus either a CSR or the key algorithm for a server-generated key"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueRequest" }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCertificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }

  /certificates/{certificateId}:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    get:
      tags: [certificates]
      operationId: getCertificate
      summary: Get certificate details
      x-required-role: viewer
      responses:
        "200":
          description: Certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /certificates/{certificateId}/download/{format}:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
      - name: format
        in: path
        required: true
        description: |
          `pem` = certificate only; `chain` = the intermediates from the issuing CA up to just below
          the root; `fullchain` = certificate + intermediates (like certbot – what nginx, Traefik and
          Caddy serve); `der` = binary certificate. The root is never part of a chain: clients already
          have it as trust anchor (RFC 8446 §4.4.2), and sending it costs bytes and gives SSL Labs'
          "chain contains anchor". Get the root from `GET /cas/{caId}/certificate`.
        schema:
          type: string
          enum: [pem, chain, fullchain, der]
    get:
      tags: [certificates]
      operationId: downloadCertificate
      summary: Download public parts (no private key)
      x-required-role: viewer
      responses:
        "200":
          description: File (Content-Disposition attachment)
          content:
            application/pem-certificate-chain:
              schema: { type: string }
            application/pkix-cert:
              schema: { type: string, contentEncoding: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /certificates/{certificateId}/export:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      tags: [certificates]
      operationId: exportCertificateWithKey
      summary: Download the private key of a server-generated key
      description: |
        Only for certificates with a server-generated key, only for an operator of the issuing CA
        with a fresh second factor, only while unsealed. Formats: `pkcs12` (with `password`, at least
        12 characters: PBES2/AES-256-CBC key, HMAC-SHA256 MAC – Windows 10 1709+, macOS, Java,
        OpenSSL), `pkcs8-pem` (the key alone, unencrypted, over TLS) and `combined-pem`
        (certificate, chain and key in one file – HAProxy). Every download is audited
        (`key.download`) before the key leaves; the response is `Cache-Control: no-store` and an
        attachment. With `delete_key_after_download` the key is destroyed on the server afterwards
        (`key.destroy`, header `X-Key-Deleted: true`); later exports answer 409. Older backups still
        hold the (encrypted) key.
      x-required-role: operator
      x-step-up: true
      requestBody:
        description: "Export format"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200":
          description: The file (Content-Disposition attachment)
          headers:
            X-Key-Deleted:
              description: "true when the key was destroyed on the server after this download"
              schema: { type: string, enum: ["true"] }
          content:
            application/x-pem-file:
              schema: { type: string }
            application/x-pkcs12:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Sealed" }

  /certificates/{certificateId}/revoke:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      tags: [certificates]
      operationId: revokeCertificate
      summary: Revoke a certificate (irreversible)
      description: |
        The CRL of the issuing CA is signed again at once. While the server is sealed the
        revocation is stored and audited, and the CRL follows at the unseal (`crl_published`
        false). `certificateHold` is not offered (final reasons only). keyCompromise blocks the key
        for every later request.
      x-required-role: operator
      x-step-up: true
      requestBody:
        description: "Revocation reason and optional invalidity date"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /certificates/{certificateId}/renew:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      tags: [certificates]
      operationId: renewCertificate
      summary: Issue a successor with the same names, preset and CA
      description: |
        The successor always gets a new key: a server-generated one when the original had one,
        otherwise from `csr_pem` (required then). With `revoke_previous` the original is revoked
        as superseded afterwards (needs the step-up of a revocation, checked first).
      x-required-role: operator
      requestBody:
        description: "Options for the successor; an empty body is fine for server-generated keys"
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewRequest" }
      responses:
        "201":
          description: New certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCertificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }

  /csr/inspect:
    post:
      tags: [certificates]
      operationId: inspectCSR
      summary: Parse a CSR and show what it asks for – nothing is issued
      description: |
        Lets the UI preview a CSR (untrusted input) before issuing. The signature is verified; a
        broken CSR is a policy violation. Needs the operator role on one CA at least.
      x-required-role: operator
      requestBody:
        description: "PKCS#10 request in PEM (untrusted input)"
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr_pem]
              additionalProperties: false
              properties:
                csr_pem: { type: string, maxLength: 65536 }
      responses:
        "200":
          description: Parsed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSRInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  # ---------------------------------------------------------------- imports
  /imports/legacy:
    post:
      tags: [imports]
      operationId: startLegacyImport
      summary: Import a pki.sh directory (base64 .tar.gz of ./pki)
      description: |
        Runs at once (a homelab PKI imports in seconds) and is recorded as an import job. Serial
        numbers, revocations (time and reason) and CRL numbers are kept; online CAs sign their next
        CRL in the import transaction. The root becomes an offline root unless `root_key` is
        `online`. Archive: at most 64 MiB, files and directories only. Passphrases of encrypted keys
        are used once and never stored. Every run is recorded as a job (201): a refused import has
        status `failed` and lists every problem, and nothing else is written; 422 means the archive
        can't be read. `dry_run` checks everything and writes only the job.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The archive and the options"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegacyImportUpload" }
      responses:
        "201":
          description: Imported (or checked, for a dry run)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }

  /imports/{importId}:
    get:
      tags: [imports]
      operationId: getImport
      summary: The report of an import
      x-required-role: admin
      parameters:
        - name: importId
          description: "ID returned when the import ran"
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ID" }
      responses:
        "200":
          description: The recorded job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /imports/external-certificate:
    post:
      tags: [imports]
      operationId: importExternalCertificate
      summary: Add a certificate from another CA for expiry monitoring
      description: "Stored with `source: external`; never signed, renewed or revoked by this server."
      x-required-role: admin
      requestBody:
        description: "One certificate in PEM"
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate_pem]
              additionalProperties: false
              properties:
                certificate_pem: { type: string, maxLength: 65536 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  # ---------------------------------------------------------------- audit
  /audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: Read the audit log (newest first)
      description: |
        The tenant log for operators and admins with a tenant-wide role (the viewer role has no
        audit access: user names and addresses are personal data); `scope=instance` for instance
        admins (sign-ins, users, unseal).
      x-required-role: operator
      parameters:
        - name: scope
          description: "tenant = the tenant log, instance = sign-ins, users, unseal (instance admins)"
          in: query
          schema: { type: string, enum: [tenant, instance], default: tenant }
        - name: action
          in: query
          description: Prefix of the action, e.g. `certificate.` or `user.login`
          schema: { type: string, maxLength: 64 }
        - name: result
          description: "Only this result"
          in: query
          schema: { type: string, enum: [success, failure, denied] }
        - name: since
          description: "Only entries from this time on"
          in: query
          schema: { type: string, format: date-time }
        - name: until
          description: "Only entries before this time"
          in: query
          schema: { type: string, format: date-time }
        - name: before
          in: query
          description: "Cursor: the next_before of the previous page"
          schema: { type: integer, minimum: 1 }
        - name: limit
          description: "Entries per page (1 to 100)"
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema:
                type: object
                required: [items, next_before]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AuditEntry" }
                  next_before: { type: [integer, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/verify:
    post:
      tags: [audit]
      operationId: verifyAuditChain
      summary: Walk the hash chain and the signed checkpoints of a log
      x-required-role: operator
      requestBody:
        description: "Which log, and the checkpoint key fingerprint noted at init (recommended)"
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scope: { type: string, enum: [tenant, instance], default: tenant }
                checkpoint_key: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Result of the walk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerifyResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-myownpki_session
      description: Server-side session; HttpOnly, Secure, SameSite=Strict.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token for every state-changing request with a session cookie.
    bearer:
      type: http
      scheme: bearer
      description: "API token (`Authorization: Bearer <token>`); scoped and expiring."

  parameters:
    Limit:
      description: "Maximum number of items per page"
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque value from `next_cursor` of the previous page
      schema: { type: string, maxLength: 512 }
    CAId:
      description: "ID of the CA"
      name: caId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    DomainId:
      description: "ID of the domain"
      name: domainId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }

    CertificateId:
      description: "ID of the certificate"
      name: certificateId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }

  responses:
    BadRequest:
      description: Malformed request or invalid fields
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
    Unauthorized:
      description: Not logged in, session expired or invalid token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Role too low, an API token on a step-up operation (type `forbidden`), or step-up required (type `step-up-required`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Object doesn't exist or is not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State doesn't allow the action (e.g. already revoked, already unsealed)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: Request body or upload exceeds the size limit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PolicyViolation:
      description: Request is well-formed but violates policy (name constraints, key policy, CA validity)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
    TooManyRequests:
      description: Rate limit or lockout; see the Retry-After header
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Sealed:
      description: The server is sealed; signing is impossible until unseal
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: A request body that is not `application/json`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    WrongSecret:
      description: The session (or the pending sign-in) is valid, but the passphrase or code is wrong (type `wrong-secret`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Busy:
      description: Too many password checks at once; see the Retry-After header
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ID:
      type: string
      description: Opaque identifier
      pattern: "^[0-9A-Za-z_-]{1,64}$"

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            One of `about:blank` or `urn:myownpki:problem:` + bad-request, unauthorized,
            forbidden, step-up-required, not-found, conflict, too-large, unsupported-media-type,
            policy-violation, wrong-secret, rate-limited, busy, sealed, internal
          examples: ["urn:myownpki:problem:step-up-required"]
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        request_id:
          type: string
          description: Correlates with server logs (also the X-Request-ID header)

    ValidationProblem:
      description: "Problem details with one entry per invalid field"
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: JSON pointer to the offending field
                  message: { type: string }

    SystemStatus:
      description: "Server version, seal state and server time (UTC)"
      type: object
      required: [version, sealed, demo, server_time]
      properties:
        version: { type: string }
        sealed: { type: boolean }
        sealed_since:
          type: [string, "null"]
          format: date-time
          description: Since when signing is impossible; null while unsealed
        demo:
          type: boolean
          description: Made by `init --demo` – all secrets in one file, not for production
        server_time: { type: string, format: date-time }

    UnsealRequest:
      description: "Passphrase that unlocks the online CA keys"
      type: object
      required: [passphrase]
      additionalProperties: false
      properties:
        passphrase: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }

    LoginRequest:
      description: "First login factor"
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }

    LoginResponse:
      description: "Result of the first factor – a second factor is always required"
      type: object
      required: [second_factor_required, methods, pending_expires_at]
      properties:
        second_factor_required: { type: boolean, const: true }
        methods:
          type: array
          description: "totp (a recovery code works in its place); webauthn when the user has a passkey and the server has auth.passkey_origin"
          items: { type: string, enum: [totp, webauthn] }
        first_totp:
          type: boolean
          description: The authenticator was never confirmed – this sign-in completes the setup from init or reset-2fa
        pending_expires_at:
          type: string
          format: date-time
          description: The second factor must follow before this time (5 minutes)

    TOTPRequest:
      description: "TOTP or recovery code for the second factor"
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            6-digit TOTP code (a space in the middle is fine) or a recovery code
            (20 characters in groups of five, any case, hyphens or spaces optional)
          pattern: "^([0-9]{3} ?[0-9]{3}|[0-9A-Za-z]{5}([- ]?[0-9A-Za-z]{5}){3})$"
          writeOnly: true

    StepUpRequest:
      description: "A fresh TOTP code for a sensitive action"
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 6-digit TOTP code (a space in the middle is fine)
          pattern: "^[0-9]{3} ?[0-9]{3}$"
          writeOnly: true

    TOTPEnrollment:
      description: "Secret for the authenticator app – returned once"
      type: object
      required: [otpauth_uri, secret]
      additionalProperties: false
      properties:
        otpauth_uri: { type: string, description: "otpauth:// URI for the QR code – shown once" }
        secret: { type: string, description: "The same secret for typing in" }

    RecoveryCodes:
      description: "One-time recovery codes for when the authenticator is lost"
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          description: Shown exactly once; stored only as hashes
          items: { type: string }

    CurrentPassword:
      description: "The current password, for changes to the own account"
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }

    WebAuthnPasskey:
      description: "A registered passkey (no key material)"
      type: object
      required: [id, name, created_at, last_used_at]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    WebAuthnOptions:
      type: object
      description: WebAuthn options as JSON (passed unchanged to the browser API)
      additionalProperties: true

    WebAuthnCredential:
      type: object
      description: Credential returned by the browser API, serialized as JSON
      additionalProperties: true

    Session:
      description: "The signed-in user, roles and session lifetimes"
      type: object
      required: [user, roles, idle_expires_at, absolute_expires_at, step_up_valid_until, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/SessionUser" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
        idle_expires_at:
          type: string
          format: date-time
          description: The session ends at this time without activity (30 minutes idle)
        absolute_expires_at:
          type: string
          format: date-time
          description: The session ends at this time in any case (12 hours after sign-in)
        step_up_valid_until:
          type: [string, "null"]
          format: date-time
        csrf_token:
          type: string
          description: Send it as X-CSRF-Token on every state-changing request
        recovery_codes_left:
          type: integer
          minimum: 0
          description: Only after a sign-in with a recovery code
        warnings:
          type: array
          items: { type: string }

    SessionUser:
      description: "Who is signed in"
      type: object
      required: [id, username, instance_admin]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        username: { type: string }
        instance_admin:
          type: boolean
          description: May unseal and manage users – gives no rights in a tenant

    Role:
      description: "Role, from least to most rights – viewer, operator, admin"
      type: string
      enum: [viewer, operator, admin]

    RoleBinding:
      description: "A role granted on a scope (the tenant or one CA)"
      type: object
      required: [role, scope]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        scope:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [tenant, ca]
              description: Domain and agent-group scopes follow in phases 2 and 3
            id:
              $ref: "#/components/schemas/ID"

    User:
      description: "A local user account (no secrets)"
      type: object
      required: [id, username, instance_admin, disabled, locked_until, mfa, roles, created_at]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        username: { type: string }
        instance_admin: { type: boolean }
        disabled: { type: boolean }
        locked_until: { type: [string, "null"], format: date-time, description: "Locked after failed sign-ins until then" }
        mfa:
          type: object
          required: [totp_confirmed, passkeys]
          additionalProperties: false
          properties:
            totp_confirmed: { type: boolean, description: "false until the first sign-in confirms the secret" }
            passkeys: { type: integer, minimum: 0 }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
        created_at: { type: string, format: date-time }

    UserCreate:
      description: "A new local user"
      type: object
      required: [username, password, roles]
      additionalProperties: false
      properties:
        username: { type: string, pattern: "^[a-z0-9][a-z0-9._@-]{0,63}$", description: "Lower case; anything else is refused, not converted" }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 256
        instance_admin: { type: boolean, default: false }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }

    UserCreated:
      description: "A created user and the second factor to hand over – shown once"
      type: object
      required: [user, otpauth_uri, secret, recovery_codes]
      additionalProperties: false
      properties:
        user: { $ref: "#/components/schemas/User" }
        otpauth_uri: { type: string }
        secret: { type: string, description: "The TOTP secret for typing in" }
        recovery_codes: { type: array, items: { type: string } }

    UserUpdate:
      description: "Changes to a user (at least one)"
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        disabled: { type: boolean }
        unlock: { type: boolean, description: "End a lockout early (like myownpki user unlock)" }

    Token:
      description: "An API token (never the secret)"
      type: object
      required: [id, name, roles, created_at, expires_at, last_used_at]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    TokenCreate:
      description: "A new API token"
      type: object
      required: [name, roles, expires_at]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        roles:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/RoleBinding" }
        expires_at: { type: string, format: date-time, description: "At most one year ahead" }

    TokenCreated:
      description: "A new token with its secret – shown only in this answer"
      type: object
      required: [id, name, roles, created_at, expires_at, last_used_at, secret]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        secret: { type: string, pattern: "^mop_[a-z2-7]+$" }

    TenantSettings:
      description: "Settings of the tenant"
      type: object
      required: [allow_server_keygen, subject_defaults]
      additionalProperties: false
      properties:
        allow_server_keygen: { type: boolean }
        subject_defaults:
          type: object
          required: [organization, organizational_unit, locality, state, country]
          additionalProperties: false
          properties:
            organization: { type: string, maxLength: 64 }
            organizational_unit: { type: string, maxLength: 64 }
            locality: { type: string, maxLength: 128 }
            state: { type: string, maxLength: 128 }
            country: { type: string, pattern: "^([A-Z]{2})?$" }
        acme_limits:
          description: |
            Rate limits of the ACME server, per hour (since 0.2). Always in the answer; optional in
            a change – left out, the stored limits stay. A client over a limit gets 429
            `rateLimited` with Retry-After.
          type: object
          required: [orders_per_account, failed_per_name, accounts_per_ip]
          additionalProperties: false
          properties:
            orders_per_account: { type: integer, minimum: 1, maximum: 10000, description: "New orders per account" }
            failed_per_name: { type: integer, minimum: 1, maximum: 100, description: "Failed validations per name" }
            accounts_per_ip: { type: integer, minimum: 1, maximum: 1000, description: "New accounts per client address (IPv6 per /64)" }

    PasswordChange:
      description: "Password change of the logged-in user"
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password, writeOnly: true, maxLength: 1024 }
        new_password: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 1024 }

    SANType:
      description: "Kind of subject alternative name"
      type: string
      enum: [dns, ip, email, uri]

    Preset:
      type: object
      description: Mirrors presets/*.yaml (see presets/README.md)
      required: [name, description, family, validity_days, key_usage, ext_key_usage, subject_alt_names, openssl_purpose, ocsp_no_check, customizable]
      properties:
        name: { type: string }
        description: { type: string }
        usage: { type: string }
        family: { type: string, enum: [server, vpnserver, client, codesign, ocsp, timestamp, custom] }
        validity_days: { type: integer }
        key_usage:
          type: object
          required: [rsa, other]
          properties:
            rsa: { type: array, items: { type: string } }
            other: { type: array, items: { type: string } }
        ext_key_usage:
          type: object
          required: [usages, critical]
          properties:
            usages: { type: array, items: { type: string } }
            critical: { type: boolean }
        subject_alt_names:
          type: object
          required: [required_any_of, offered]
          properties:
            required_any_of: { type: array, items: { $ref: "#/components/schemas/SANType" } }
            offered: { type: array, items: { $ref: "#/components/schemas/SANType" } }
        common_name_from: { type: string, enum: ["", dns, email] }
        openssl_purpose: { type: string }
        ocsp_no_check: { type: boolean }
        customizable: { type: boolean }
        wildcard:
          type: boolean
          description: DNS names like *.example.com are allowed and at least one is required

    KeyAlgorithm:
      type: string
      description: |
        Key type and size of a certificate's key. ecdsa-p256 is the default for leaves. Ed25519
        server certificates are not accepted by browsers; rsa-2048 is flagged as compatibility only
        (BSI TR-02102 recommends 3000 bit or more). RSA keys from a CSR may have other sizes (2048-8192).
      pattern: "^(ecdsa-p256|ecdsa-p384|ecdsa-p521|ed25519|rsa-[0-9]{4})$"

    GeneratedKeyAlgorithm:
      type: string
      description: Key algorithms the server generates (server-side keys)
      enum: [ecdsa-p256, ecdsa-p384, ecdsa-p521, ed25519, rsa-2048, rsa-3072, rsa-4096]

    Subject:
      description: "Distinguished name parts of a certificate subject"
      type: object
      required: [common_name]
      properties:
        common_name: { type: string, minLength: 1, maxLength: 64 }
        organization: { type: string, maxLength: 64 }
        organizational_unit: { type: string, maxLength: 64 }
        locality: { type: string, maxLength: 128 }
        state: { type: string, maxLength: 128 }
        country: { type: string, pattern: "^[A-Z]{2}$" }

    SANs:
      description: "Subject alternative names, grouped by kind"
      type: object
      properties:
        dns:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 253 }
        ip:
          type: array
          maxItems: 100
          items: { type: string, description: "IPv4 or IPv6 address" }
        email:
          type: array
          maxItems: 100
          items: { type: string, format: email }
        uri:
          type: array
          maxItems: 100
          items: { type: string, format: uri }

    CAKind:
      description: "Root (self-signed) or intermediate CA"
      type: string
      enum: [root, intermediate]

    CAStatus:
      description: "Lifecycle state of a CA"
      type: string
      enum: [active, pending_signature, expired, revoked, retired]

    KeyMode:
      type: string
      description: ADR-09 – offline (certificate only), online_encrypted (unseal needed), hsm
      enum: [offline, online_encrypted, hsm]

    DomainSettings:
      description: "Changeable settings of a domain"
      type: object
      properties:
        ca_id: { $ref: "#/components/schemas/ID" }
        include_subdomains: { type: boolean, description: "Names below the domain are covered too" }
        wildcards: { type: boolean, description: "`*.name` may be ordered (dns-01 only; needs include_subdomains)" }
        challenge_types:
          type: array
          minItems: 1
          items: { type: string, enum: [http-01, dns-01] }
        approval:
          type: string
          enum: [open, account, new_name]
          description: "open: any account; account: approved or EAB-bound accounts; new_name: the first issuance per name needs approval"
        preset: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
        validity_days: { type: integer, minimum: 0, description: "0 = 90 days; capped by the CA's maximum" }
        address_policy:
          type: string
          enum: [internal, public]
          description: "Which addresses the http-01 check may connect to"
        ip_ranges:
          type: array
          items: { type: string, maxLength: 43 }
          description: "IPs or CIDRs for IP identifiers (http-01 only)"

    DomainCreate:
      description: "A new domain"
      allOf:
        - $ref: "#/components/schemas/DomainSettings"
        - type: object
          required: [name, ca_id]
          properties:
            name: { type: string, maxLength: 253, description: "Lower case, punycode, at least two labels" }

    DomainUpdate:
      description: "Settings to change"
      $ref: "#/components/schemas/DomainSettings"

    Domain:
      description: "A domain ACME issues for"
      type: object
      required: [id, name, ca_id, ca_name, include_subdomains, wildcards, challenge_types, approval, preset,
                 validity_days, address_policy, ip_ranges, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        ca_id: { $ref: "#/components/schemas/ID" }
        ca_name: { type: string }
        include_subdomains: { type: boolean }
        wildcards: { type: boolean }
        challenge_types:
          type: array
          items: { type: string, enum: [http-01, dns-01] }
        approval: { type: string, enum: [open, account, new_name] }
        preset: { type: string }
        validity_days: { type: integer, minimum: 1 }
        address_policy: { type: string, enum: [internal, public] }
        ip_ranges:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CA:
      description: "A certificate authority of this tenant with its generations (one per key)"
      type: object
      required: [id, name, kind, status, key_mode, parent, public_base_url, crl_days, max_validity_days,
                 path_len, name_constraints, name_constraints_critical, eku_limit, current_generation, generations]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/CAKind" }
        status: { $ref: "#/components/schemas/CAStatus" }
        key_mode: { $ref: "#/components/schemas/KeyMode" }
        parent:
          type: [string, "null"]
          description: Name of the parent CA; null for a root
        public_base_url:
          type: string
          format: uri
          description: Base of AIA/CRL URLs in issued certificates – immutable after the first issuance
        crl_days: { type: integer, minimum: 1 }
        max_validity_days: { type: integer, minimum: 1 }
        path_len: { type: [integer, "null"], minimum: 0 }
        name_constraints:
          type: array
          items: { $ref: "#/components/schemas/NameConstraint" }
        name_constraints_critical: { type: boolean }
        eku_limit:
          type: array
          description: EKUs this CA may issue (names, or OIDs for unnamed ones); empty = no limit
          items: { type: string }
        current_generation:
          type: [integer, "null"]
          minimum: 1
          description: The generation that signs; null while the first waits for its offline signature
        generations:
          type: array
          items: { $ref: "#/components/schemas/CAGeneration" }

    NameConstraint:
      description: "One name constraint of a CA"
      type: object
      required: [mode, type, value]
      properties:
        mode: { type: string, enum: [permitted, excluded] }
        type: { type: string, enum: [dns, ip, email] }
        value: { type: string }

    CAGeneration:
      description: "One key and certificate of a CA"
      type: object
      required: [generation, current, pending, key_algorithm, subject, issuer, certificate_url, crl_url, warnings]
      properties:
        generation: { type: integer, minimum: 1 }
        current: { type: boolean }
        pending:
          type: boolean
          description: Waits for the certificate from the offline root
        key_algorithm: { $ref: "#/components/schemas/KeyAlgorithm" }
        subject: { type: string, description: Subject DN as an RFC 4514 string }
        serial: { type: string, pattern: "^[0-9A-F]+$" }
        fingerprint_sha256: { type: string, pattern: "^[0-9A-F]{64}$" }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        issuer:
          type: [string, "null"]
          description: Parent CA and generation, e.g. `root/1`; null for a root
        certificate_url: { type: string, format: uri, description: Where MyOwnPKI publishes this certificate (AIA) }
        crl_url: { type: string, format: uri, description: Where MyOwnPKI publishes its CRL (CDP) }
        revoked:
          type: [string, "null"]
          description: "`<reason> on <date>` for a revoked generation"
        warnings:
          type: array
          items: { type: string }
        crl: { $ref: "#/components/schemas/CRLInfo" }

    CACreate:
      description: "A CA to create"
      type: object
      required: [name, kind, subject, public_base_url]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$", description: "Immutable: part of every AIA/CRL URL" }
        kind: { $ref: "#/components/schemas/CAKind" }
        parent_ca_id: { $ref: "#/components/schemas/ID" }
        subject: { $ref: "#/components/schemas/Subject" }
        key_algorithm:
          type: string
          enum: [ecdsa-p384, ecdsa-p256, rsa-3072, rsa-4096]
          description: Default ecdsa-p384
        validity_days: { type: integer, minimum: 0, maximum: 9125, description: "0 = 7300 for a root, 3650 for an intermediate (never beyond the parent)" }
        path_len: { type: integer, minimum: 0, description: "0 = may only issue end-entity certificates" }
        name_constraints: { $ref: "#/components/schemas/NameConstraintsInput" }
        eku_limit: { type: array, items: { type: string }, description: "EKU names or OIDs; empty = no limit" }
        public_base_url: { type: string, format: uri }
        crl_days: { type: integer, minimum: 0, maximum: 366, description: "0 = the default for the kind" }
        max_validity_days: { type: integer, minimum: 0, maximum: 3650, description: "0 = 397" }

    NameConstraintsInput:
      description: "Name constraints of a new intermediate (RFC 5280 4.2.1.10)"
      type: object
      additionalProperties: false
      properties:
        permitted_dns: { type: array, items: { type: string } }
        excluded_dns: { type: array, items: { type: string } }
        permitted_ip: { type: array, items: { type: string, description: "CIDR prefix" } }
        excluded_ip: { type: array, items: { type: string } }
        permitted_email: { type: array, items: { type: string } }
        excluded_email: { type: array, items: { type: string } }
        permitted_uri: { type: array, items: { type: string } }
        excluded_uri: { type: array, items: { type: string } }
        not_critical: { type: boolean, description: "Compatibility switch; RFC 5280 wants critical" }

    CAChange:
      description: "A CA after a change, with the offline bundle when it waits for its signature"
      type: object
      required: [ca, offline_signing, notes, warnings]
      additionalProperties: false
      properties:
        ca: { $ref: "#/components/schemas/CA" }
        offline_signing:
          oneOf:
            - $ref: "#/components/schemas/OfflineBundle"
            - type: "null"
        notes: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }

    OfflineBundle:
      description: "What the offline root needs to sign an intermediate"
      type: object
      required: [csr_pem, csr_file, ext_config, ext_file, cert_file, days, digest, serial, instructions]
      additionalProperties: false
      properties:
        csr_pem: { type: string }
        csr_file: { type: string }
        ext_config: { type: string, description: "The OpenSSL extension file – sign with exactly this, never the CSR's extensions" }
        ext_file: { type: string }
        cert_file: { type: string }
        days: { type: integer }
        digest: { type: string, description: "sha384 for a P-384 root; empty for Ed25519" }
        serial: { type: string }
        instructions: { type: string }

    CAImport:
      description: "The certificate of an offline root"
      type: object
      required: [name, certificate_pem, public_base_url]
      additionalProperties: false
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9._-]{0,62}$" }
        certificate_pem: { type: string, maxLength: 65536 }
        public_base_url: { type: string, format: uri }
        crl_days: { type: integer, minimum: 0, maximum: 366, description: "Lifetime of the root's CRLs; 0 = 180" }

    CAUpdate:
      description: "New limits of a CA (at least one)"
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        crl_days: { type: integer, minimum: 1, maximum: 366 }
        max_validity_days: { type: integer, minimum: 1, maximum: 3650 }

    CARenew:
      description: "Options for a new CA generation"
      type: object
      additionalProperties: false
      properties:
        key_algorithm: { type: string, enum: [ecdsa-p384, ecdsa-p256, rsa-3072, rsa-4096] }
        validity_days: { type: integer, minimum: 0, maximum: 9125 }

    CARevoke:
      description: "Revocation of a CA generation"
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [unspecified, keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, privilegeWithdrawn]
        generation: { type: integer, minimum: 0, description: "0 = the current generation" }
        invalidity_date: { type: string, format: date-time }

    CARevocationResult:
      description: "A revoked CA and whether its parent's CRL lists it already"
      type: object
      required: [ca, crl_published, crl_number, warnings]
      additionalProperties: false
      properties:
        ca: { $ref: "#/components/schemas/CA" }
        crl_published: { type: boolean }
        crl_number: { type: [integer, "null"] }
        warnings: { type: array, items: { type: string } }

    CRLSigned:
      description: "A CRL the server signed"
      type: object
      required: [ca, generation, number, this_update, next_update, entries]
      additionalProperties: false
      properties:
        ca: { type: string }
        generation: { type: integer }
        number: { type: integer }
        this_update: { type: string, format: date-time }
        next_update: { type: string, format: date-time }
        entries: { type: integer, minimum: 0 }

    CRLUploaded:
      description: "An uploaded offline root CRL"
      type: object
      required: [ca, generation, number, this_update, next_update, entries, warnings]
      additionalProperties: false
      properties:
        ca: { type: string }
        generation: { type: integer }
        number: { type: integer }
        this_update: { type: string, format: date-time }
        next_update: { type: string, format: date-time }
        entries: { type: integer, minimum: 0 }
        warnings: { type: array, items: { type: string } }

    SignedCAUpload:
      description: "Certificate of an offline-signed intermediate"
      type: object
      required: [certificate_pem]
      additionalProperties: false
      properties:
        certificate_pem: { type: string, maxLength: 65536 }

    CRLInfo:
      description: "The newest CRL of a CA generation and what it needs"
      type: object
      required: [state, number, unpublished]
      properties:
        state:
          type: string
          enum: [ok, renew_due, warning, expired, missing]
          description: renew_due after a third of the lifetime, warning from half, expired after nextUpdate
        number: { type: integer, minimum: 0, description: "Strictly increasing per CA; 0 = none yet" }
        source: { type: string, enum: [signed, uploaded] }
        this_update: { type: string, format: date-time }
        next_update: { type: string, format: date-time }
        unpublished:
          type: integer
          minimum: 0
          description: Revocations not on the newest CRL yet – they take effect only once a CRL lists them
        message:
          type: string
          description: What an admin should know; absent when all is well

    CertificateStatus:
      description: "Validity state of a certificate"
      type: string
      enum: [valid, revoked, expired]

    RevocationReason:
      type: string
      description: RFC 5280 §5.3.1 (certificateHold intentionally not offered)
      enum: [unspecified, keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, privilegeWithdrawn]

    Certificate:
      description: "An end-entity certificate known to this tenant"
      type: object
      required: [id, ca_id, ca_name, status, source, subject, common_name, sans, serial, not_before, not_after,
                 key_algorithm, fingerprint_sha256, key_stored, created_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        ca_id: { type: [string, "null"], description: "null for external certificates" }
        ca_name: { type: [string, "null"] }
        ca_generation: { type: [integer, "null"], minimum: 1 }
        preset: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/CertificateStatus" }
        source:
          type: string
          enum: [issued, imported, external]
        subject: { type: string, description: Subject DN as an RFC 4514 string }
        common_name: { type: string, description: "Empty when the certificate has no CN" }
        sans: { $ref: "#/components/schemas/SANs" }
        serial: { type: string, pattern: "^[0-9A-F]+$" }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        key_algorithm: { $ref: "#/components/schemas/KeyAlgorithm" }
        key_stored:
          type: boolean
          description: The server holds the (encrypted) private key – only for server-generated keys
        fingerprint_sha256: { type: string, pattern: "^[0-9A-F]{64}$" }
        revocation:
          type: [object, "null"]
          required: [reason, revoked_at]
          properties:
            reason: { $ref: "#/components/schemas/RevocationReason" }
            revoked_at: { type: string, format: date-time }
            invalidity_date: { type: [string, "null"], format: date-time }
        renewal_of: { type: [string, "null"] }
        issued_by: { type: [string, "null"], description: User or token that requested it }
        created_at: { type: string, format: date-time }

    CertificateList:
      description: "One page of certificates"
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Certificate" }
        next_cursor: { type: [string, "null"] }

    IssueRequest:
      description: "Request to issue a certificate; exactly one of `csr_pem` or `key`"
      type: object
      required: [ca_id, preset]
      additionalProperties: false
      oneOf:
        - required: [csr_pem]
        - required: [key]
      properties:
        ca_id: { $ref: "#/components/schemas/ID" }
        preset: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
        subject: { $ref: "#/components/schemas/Subject" }
        sans: { $ref: "#/components/schemas/SANs" }
        validity_days:
          type: integer
          minimum: 1
          description: Defaults to the preset; capped by the CA's limit and its own notAfter
        csr_pem: { type: string, maxLength: 65536 }
        use_csr_sans:
          type: boolean
          default: true
          description: false = ignore names in the CSR, use only `sans` (legacy --no-csr-san)
        key:
          type: object
          required: [algorithm]
          additionalProperties: false
          properties:
            algorithm: { $ref: "#/components/schemas/GeneratedKeyAlgorithm" }
        key_usage:
          type: array
          items: { type: string }
          description: Key usages – only for customizable presets; validated like preset files
        ext_key_usage:
          type: array
          items: { type: string }
          description: Extended key usages – only for customizable presets; validated like preset files

    IssuedCertificate:
      description: "A new certificate, with what the server changed or dropped"
      allOf:
        - $ref: "#/components/schemas/Certificate"
        - type: object
          required: [notes, warnings, dropped_csr_names]
          properties:
            notes:
              type: array
              description: Defaults that changed the request (validity shortened, base domain added)
              items: { type: string }
            warnings:
              type: array
              description: Compatibility problems that didn't stop the issuance
              items: { type: string }
            dropped_csr_names:
              type: array
              description: Names from the CSR the preset doesn't take, as `type:value`
              items: { type: string }

    RevokeRequest:
      description: "Request to revoke a certificate"
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/RevocationReason" }
        invalidity_date:
          type: string
          format: date-time
          description: When the key is known or suspected to have been compromised

    RenewRequest:
      description: "Options for renewing a certificate"
      type: object
      additionalProperties: false
      properties:
        csr_pem:
          type: string
          maxLength: 65536
          description: Required when the original was issued from a CSR; refused otherwise
        key_algorithm:
          type: string
          description: New server key algorithm; default the original's
        revoke_previous:
          type: boolean
          default: false
          description: Revoke the old certificate with reason superseded (step-up as for a revocation)
        validity_days: { type: integer, minimum: 1 }

    RevocationResult:
      description: "A revocation and whether a CRL lists it already"
      type: object
      required: [certificate, crl_published, crl_number, warnings]
      additionalProperties: false
      properties:
        certificate: { $ref: "#/components/schemas/Certificate" }
        crl_published:
          type: boolean
          description: false while sealed – the CRL is signed at the unseal; only then clients see it
        crl_number: { type: [integer, "null"] }
        warnings:
          type: array
          items: { type: string }

    ExportRequest:
      description: "Request to export the private key of a server-generated key"
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [pkcs12, pkcs8-pem, combined-pem]
          description: |
            pkcs12 = key, certificate and chain, protected by `password`; pkcs8-pem = the key alone,
            unencrypted; combined-pem = certificate, chain and key in one PEM file.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
          description: Required for pkcs12, refused for the other formats
        delete_key_after_download:
          type: boolean
          default: false
          description: Destroy the key on the server once the file is built and the download audited

    CSRInfo:
      description: "What a CSR asks for, parsed for preview"
      type: object
      required: [subject, common_name, sans, key_algorithm, signature_valid, requested_extensions, problems, warnings]
      additionalProperties: false
      properties:
        subject: { type: string }
        common_name: { type: string }
        sans: { $ref: "#/components/schemas/SANs" }
        key_algorithm: { type: string }
        signature_valid: { type: boolean }
        requested_extensions:
          type: array
          description: Shown for information only – extensions are never copied from a CSR
          items: { type: string }
        problems:
          type: array
          description: What the key policy refuses (an issuance would be denied)
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    LegacyImportUpload:
      description: "A pki.sh directory to import"
      type: object
      required: [archive]
      additionalProperties: false
      properties:
        archive: { type: string, contentEncoding: base64, description: "The .tar.gz of ./pki (at most 64 MiB)" }
        base_url: { type: string, format: uri, description: "Public base URL for new certificates; default AIA_BASE_URL of pki.conf" }
        root_key: { type: string, enum: [offline, online], default: offline }
        dry_run: { type: boolean, default: false }
        ca_passphrases:
          type: object
          description: "Passphrases of encrypted CA keys by CA name (root, intermediates)"
          additionalProperties: { type: string, writeOnly: true }
        key_passphrase: { type: string, format: password, writeOnly: true, description: "PKI_KEY_PASS of pki.sh for encrypted leaf keys" }

    ImportJob:
      description: "A recorded legacy import"
      type: object
      required: [id, status, dry_run, started_at, finished_at, started_by, base_url, legacy_urls, cas, summary, problems, warnings]
      additionalProperties: false
      properties:
        id: { $ref: "#/components/schemas/ID" }
        status: { type: string, enum: [succeeded, checked, failed] }
        dry_run: { type: boolean }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        started_by: { type: string }
        base_url: { type: string }
        legacy_urls: { type: boolean, description: "The pki.sh URLs <base>/<name>.crt|.crl stay served" }
        cas:
          type: array
          items:
            type: object
            required: [name, kind, key_mode, status, certificates, revoked, last_crl_number, history]
            additionalProperties: false
            properties:
              name: { type: string }
              kind: { type: string }
              key_mode: { type: string }
              status: { type: string }
              certificates: { type: integer }
              revoked: { type: integer }
              last_crl_number: { type: integer, description: "The newest number pki.sh used; the next CRL gets +1" }
              history: { type: integer, description: "Older certificates of the same key (pki.sh renew-ca)" }
        summary:
          type: object
          required: [certificates, revoked, keys, external]
          additionalProperties: false
          properties:
            certificates: { type: integer }
            revoked: { type: integer }
            keys: { type: integer }
            external: { type: integer }
        problems: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }

    AuditEntry:
      description: "One entry of the hash-chained audit log"
      type: object
      required: [seq, time, actor, action, result, hash, prev_hash]
      properties:
        seq: { type: integer, minimum: 1 }
        time: { type: string, format: date-time }
        actor:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [user, token, system, acme_account, agent] }
            id: { type: string }
            name: { type: string }
        action: { type: string, examples: ["certificate.revoke"] }
        target:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        source_ip: { type: string }
        details:
          type: object
          additionalProperties: true
          description: Never contains secrets or key material
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        prev_hash: { type: string, pattern: "^[0-9a-f]{64}$" }

    AuditVerifyResult:
      description: "Result of walking the audit hash chain"
      type: object
      required: [ok, entries_checked, first_broken_seq, reason, head, checkpoints, checkpoint_key]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        entries_checked: { type: integer, minimum: 0 }
        first_broken_seq: { type: [integer, "null"] }
        reason: { type: [string, "null"], description: "Why the chain breaks there" }
        head: { type: string, description: "seq:hash of the last good entry – compare with the process log or a backup manifest" }
        checkpoints: { type: integer, minimum: 0 }
        checkpoint_key: { type: string, description: "Fingerprint of the key that signs the checkpoints" }

