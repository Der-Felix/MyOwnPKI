openapi: 3.1.0
info:
  title: MyOwnPKI Admin API
  version: 0.2.0-draft
  summary: REST API of the MyOwnPKI admin listener (phase 1 scope)
  description: |
    Phase 1 (docs/PLAN.md §10): CAs, certificates, presets, upload/download, revocation,
    legacy import, login with mandatory second factor, RBAC, unseal and audit log.
    ACME (phase 2), domains/policies (phase 2) and agents (phase 3) are not part of it.
    Step 13 implements the operations needed for the first browser test (see docs/PHASE1.md);
    the others follow in step 18 and answer 404 until then.

    **Conventions**
    - Served only on the admin listener (ADR-08), base path `/api/v1`. The listener's own
      `GET /healthz` (outside the API) is the only health check.
    - JSON with `snake_case` fields; times are RFC 3339 in UTC; serial numbers and
      fingerprints are upper-case hex without separators.
    - Requests with a body must send `Content-Type: application/json` (otherwise 415); unknown
      fields and trailing data are refused (400). Bodies are limited to 128 KiB (413).
    - Errors use RFC 9457 `application/problem+json`. Problem `type` values are URNs
      (`urn:myownpki:problem:<name>`), listed in the `Problem` schema. Every response carries
      `X-Request-ID`; problems repeat it as `request_id`.
    - Authentication: a browser session (cookie `__Host-myownpki_session` + `X-CSRF-Token` header
      on state-changing requests) **or**, from step 18, an API token (`Authorization: Bearer`).
      The tenant always comes from the authenticated context, never from a request parameter.
    - `x-required-role` names who may call an operation: `none` (public), `signed-in` (any
      signed-in user), `instance-admin`, or the minimum tenant role (`viewer` < `operator` <
      `admin`) within the scope of the target object. The service layer enforces it, not only
      the handler.
    - Objects the caller may not read answer **404**, like unknown IDs – nobody can probe what
      exists. Whoever may read an object but lacks the role for an action gets **403**.
    - `x-step-up: true` means a fresh second factor is required (see `POST /auth/step-up`);
      otherwise the request fails with `403` and problem type `step-up-required`.
    - `x-passive: true`: the request doesn't count as activity – polling it doesn't keep a
      session alive past its idle timeout (decided by the route, not by the client).
    - Lists use cursor pagination: `limit` (at most 100) + `cursor`, response field `next_cursor`.
    - Certificate issuance through this API runs through the same policy engine as the
      ACME server of phase 2 (ADR-19). Extensions always come from the preset, never from a CSR.
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: /api/v1
    description: Admin listener (default port 9443)

security:
  - session: []
    csrf: []
  - bearer: []

tags:
  - name: system
    description: Status, seal/unseal
  - name: auth
    description: Login, second factor, step-up, session
  - name: users
    description: Local users, roles, second-factor enrollment
  - name: tokens
    description: API tokens
  - name: presets
    description: Certificate presets (read-only, built in)
  - name: cas
    description: Root and intermediate certificate authorities
  - name: certificates
    description: Issue, inspect, download, revoke and renew certificates
  - name: imports
    description: Import of a legacy pki.sh directory and of external certificates
  - name: audit
    description: Tamper-evident audit log

paths:
  # ---------------------------------------------------------------- system
  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      summary: Version, seal state and server time
      description: Polled by the UI; it doesn't keep the session alive.
      x-required-role: signed-in
      x-passive: true
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/unseal:
    post:
      tags: [system]
      operationId: unseal
      summary: Unlock the encrypted CA keys
      description: |
        The server starts sealed: online CA keys are stored encrypted and no signing is possible.
        The passphrase derives the key-encryption key (Argon2id); the decrypted keys stay in memory
        only. A signed-in instance admin plus the passphrase – the passphrase is the stronger
        proof, so no step-up. Wrong passphrases are slowed down per instance and per client
        address (three free, then 1 minute doubling up to 1 hour); every attempt is audited and a
        success resets the instance and that address.
      x-required-role: instance-admin
      requestBody:
        description: "The unseal passphrase"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnsealRequest" }
      responses:
        "200":
          description: Unsealed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /system/seal:
    post:
      tags: [system]
      operationId: seal
      summary: Remove all CA keys from memory immediately
      description: Emergency stop. Signing stops until the next unseal. Sealing a sealed server does nothing.
      x-required-role: instance-admin
      responses:
        "200":
          description: Sealed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------------------------------------------------------- auth
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: First factor (username + password)
      description: |
        On success the session cookie holds a **pending** session: valid for 5 minutes and only
        for `/auth/totp`. Works while the server is sealed (the second factor is encrypted with
        the auth key, not the unseal key). Throttled before any hash is computed; repeated
        failures lock the account for a while. A browser that completed a sign-in before brings
        its device cookie (`__Host-myownpki_device`) and is judged by its own counter instead.
      security: []
      x-required-role: none
      requestBody:
        description: "Username and password (first factor)"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Password accepted, second factor required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Busy" }

  /auth/totp:
    post:
      tags: [auth]
      operationId: verifyTOTP
      summary: Second factor with a TOTP code (or a recovery code)
      description: |
        Needs the pending session of `/auth/login`. Failures count in the same throttle and
        lockout as wrong passwords. A wrong code answers 422 `wrong-secret` (the pending session
        stays – type it again); 401 means the pending session is missing or over – sign in again.
        On success the pending session ends and a **new** session ID
        is set (no session fixation), together with a renewed device cookie (one year).
      security: []
      x-required-role: none
      requestBody:
        description: "TOTP code from the authenticator app, or a recovery code"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPRequest" }
      responses:
        "200":
          description: Signed in; session cookie set with a new ID
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/webauthn/begin:
    post:
      tags: [auth]
      operationId: beginWebAuthnLogin
      summary: Start a passkey/WebAuthn assertion (second factor or step-up)
      description: |
        With the pending session of `POST /auth/login` this is the second factor; with a full session
        it is a step-up. The options go unchanged to `navigator.credentials.get()`. Passkeys need
        `auth.passkey_origin` in the configuration (otherwise 404) and a registered passkey (otherwise 409).
      security: []
      x-required-role: none
      responses:
        "200":
          description: PublicKeyCredentialRequestOptions for navigator.credentials.get()
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/webauthn/finish:
    post:
      tags: [auth]
      operationId: finishWebAuthnLogin
      summary: Complete the WebAuthn assertion
      description: |
        After the password: a new session ID and a device cookie, as after a TOTP code. Signed in: the
        step-up time is refreshed. A refused assertion counts like a wrong code (throttle, lockout).
      security: []
      x-required-role: none
      requestBody:
        description: "Assertion returned by navigator.credentials.get()"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "200":
          description: Logged in (or step-up refreshed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/step-up:
    post:
      tags: [auth]
      operationId: stepUp
      summary: Confirm the second factor again for a sensitive action
      description: |
        Refreshes `step_up_valid_until` of the current session (5 minutes). TOTP only – recovery
        codes are for signing in. For WebAuthn, use `/auth/webauthn/begin` + `/auth/webauthn/finish`
        while signed in instead (step 17).
      x-required-role: signed-in
      requestBody:
        description: "A fresh TOTP code"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpRequest" }
      responses:
        "200":
          description: Step-up valid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current user, roles and session state
      description: Doesn't keep the session alive (the UI polls it for the idle countdown).
      x-required-role: signed-in
      x-passive: true
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session (server-side)
      description: The device cookie stays – the browser remains a known device.
      x-required-role: signed-in
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ---------------------------------------------------------------- users
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List local users
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a local user
      description: The user must enroll a second factor at first login before anything else works.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The new user with an initial password and role bindings"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [users]
      operationId: getUser
      summary: Get a user
      x-required-role: admin
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [users]
      operationId: updateUser
      summary: Change display name, e-mail or disable a user
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "Fields to change (at least one)"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user (the audit log keeps the history)
      x-required-role: admin
      x-step-up: true
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/{userId}/roles:
    parameters:
      - $ref: "#/components/parameters/UserId"
    put:
      tags: [users]
      operationId: setUserRoles
      summary: Replace the role bindings of a user
      description: Sessions of the user are rotated so the change takes effect immediately.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The complete new set of role bindings – replaces all existing ones"
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/RoleBinding" }
      responses:
        "200":
          description: New role bindings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoleBinding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/me/password:
    put:
      tags: [users]
      operationId: changeOwnPassword
      summary: Change the own password
      x-required-role: signed-in
      x-step-up: true
      requestBody:
        description: "Current and new password"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Changed; other sessions of the user are ended }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /users/me/totp:
    post:
      tags: [users]
      operationId: beginTOTPEnrollment
      summary: Start TOTP enrollment (returns the otpauth URI once)
      x-required-role: signed-in
      responses:
        "200":
          description: Secret for the authenticator app – shown only now
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TOTPEnrollment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /users/me/totp/confirm:
    post:
      tags: [users]
      operationId: confirmTOTPEnrollment
      summary: Confirm TOTP enrollment with a first code; returns recovery codes once
      x-required-role: signed-in
      requestBody:
        description: "First code from the authenticator app, proving the secret was stored"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TOTPRequest" }
      responses:
        "200":
          description: TOTP active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/webauthn:
    get:
      tags: [users]
      operationId: listWebAuthnCredentials
      summary: List the own passkeys
      x-required-role: signed-in
      responses:
        "200":
          description: The own passkeys (no key material)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/WebAuthnPasskey" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /users/me/webauthn/begin:
    post:
      tags: [users]
      operationId: beginWebAuthnRegistration
      summary: Start registering a passkey / security key
      description: |
        Needs a fresh step-up **and** the current password (a new second factor is never added with
        the session alone). User verification is required (PIN or biometrics), attestation is not
        asked for. At most 10 passkeys per user.
      x-required-role: signed-in
      x-step-up: true
      requestBody:
        description: "The current password"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPassword" }
      responses:
        "200":
          description: PublicKeyCredentialCreationOptions for navigator.credentials.create()
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnOptions" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/me/webauthn/finish:
    post:
      tags: [users]
      operationId: finishWebAuthnRegistration
      summary: Complete passkey registration
      description: |
        Stores the passkey. Every device cookie of the user becomes void and the other sessions end,
        as for every new authenticator.
      x-required-role: signed-in
      parameters:
        - name: name
          in: query
          required: false
          description: "A name to recognize the passkey by (at most 64 characters; default Passkey)"
          schema: { type: string, maxLength: 64 }
      requestBody:
        description: "Attestation returned by navigator.credentials.create()"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebAuthnCredential" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnPasskey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /users/me/webauthn/{passkeyId}:
    delete:
      tags: [users]
      operationId: deleteWebAuthnCredential
      summary: Remove an own passkey
      x-required-role: signed-in
      x-step-up: true
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema: { type: string, maxLength: 64 }
      requestBody:
        description: "The current password"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentPassword" }
      responses:
        "204": { description: Removed; device cookies of the user are void }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/WrongSecret" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ---------------------------------------------------------------- tokens
  /tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: List the own API tokens (never the secret)
      x-required-role: viewer
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/APIToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create an API token – the secret is returned exactly once
      description: Stored only as a hash. A token can never have more rights than its owner.
      x-required-role: viewer
      x-step-up: true
      requestBody:
        description: "Name, scopes and lifetime of the new token"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/APITokenCreate" }
      responses:
        "201":
          description: "Token created; the secret is in `token`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APITokenCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tokens/{tokenId}:
    parameters:
      - name: tokenId
        description: "ID of the token"
        in: path
        required: true
        schema: { $ref: "#/components/schemas/ID" }
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: Revoke an API token immediately
      x-required-role: viewer
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- presets
  /presets:
    get:
      tags: [presets]
      operationId: listPresets
      summary: List the certificate presets
      description: Built in and the same for everybody, so any signed-in user may read them.
      x-required-role: signed-in
      responses:
        "200":
          description: Presets, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Preset" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /presets/{presetName}:
    get:
      tags: [presets]
      operationId: getPreset
      summary: Get one preset
      x-required-role: signed-in
      parameters:
        - name: presetName
          description: "Preset name, for example `server`"
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
      responses:
        "200":
          description: Preset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- CAs
  /cas:
    get:
      tags: [cas]
      operationId: listCAs
      summary: List certificate authorities
      x-required-role: viewer
      responses:
        "200":
          description: CAs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CA" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [cas]
      operationId: createCA
      summary: Create a root or intermediate CA
      description: |
        - `kind: intermediate` with `issuer_ca_id`: signed by an online CA of this server.
        - `kind: intermediate` with `offline_signing: true`: only key + CSR are created; the
          response contains the CSR for signing on the offline root (legacy `pki.sh`). Upload
          the signed certificate with `PUT /cas/{caId}/certificate`.
        - `kind: root`: allowed, but the UI warns – a root key online is a single point of compromise,
          and a root can't really be revoked. Prefer an offline root.
        The CA's `public_base_url` is baked into every certificate (AIA, CRL DP) and can never
        change afterwards.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The CA to create"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CACreate" }
      responses:
        "201":
          description: CA created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CACreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Sealed" }

  /cas/import:
    post:
      tags: [cas]
      operationId: importCA
      summary: Import an existing CA (certificate, optional encrypted key)
      description: |
        Without a key the CA is stored in `offline` mode: the server knows the certificate (for
        chains and CRL checks) but can't sign. Keys are re-encrypted under the unseal key.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "CA certificate in PEM, optionally with its private key"
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CAImport" }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Sealed" }

  /cas/{caId}:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      tags: [cas]
      operationId: getCA
      summary: Get a CA
      x-required-role: viewer
      responses:
        "200":
          description: CA
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cas/{caId}/certificate:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      tags: [cas]
      operationId: downloadCACertificate
      summary: Download the CA certificate
      x-required-role: viewer
      parameters:
        - name: format
          description: "`pem` = CA certificate, `der` = binary, `chain` = this CA and its issuers up to the root (for trust stores; a server sends `fullchain` of its certificate instead)"
          in: query
          schema:
            type: string
            enum: [pem, der, chain]
            default: pem
      responses:
        "200":
          description: Certificate (chain = this CA and its issuers up to the root)
          content:
            application/pem-certificate-chain:
              schema: { type: string }
            application/pkix-cert:
              schema: { type: string, contentEncoding: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [cas]
      operationId: uploadSignedCACertificate
      summary: Upload the certificate of an offline-signed intermediate
      description: The certificate must match the pending key and chain to a known CA.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "The certificate signed by the offline root, optionally with its chain"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignedCAUpload" }
      responses:
        "200":
          description: CA is active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CA" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /cas/{caId}/csr:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      tags: [cas]
      operationId: downloadCACSR
      summary: Download the CSR of a CA that waits for offline signing
      x-required-role: admin
      responses:
        "200":
          description: PKCS#10 request
          content:
            application/pkcs10:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /cas/{caId}/crl:
    parameters:
      - $ref: "#/components/parameters/CAId"
    get:
      tags: [cas]
      operationId: downloadCRL
      summary: Download the current CRL (also served on the public listener)
      x-required-role: viewer
      parameters:
        - name: format
          description: "`der` = binary (as served to clients), `pem` = text"
          in: query
          schema:
            type: string
            enum: [der, pem]
            default: der
      responses:
        "200":
          description: Certificate revocation list
          content:
            application/pkix-crl:
              schema: { type: string, contentEncoding: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [cas]
      operationId: regenerateCRL
      summary: Issue a new CRL now (CRL number + 1)
      x-required-role: operator
      responses:
        "200":
          description: New CRL metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CRLInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Sealed" }

  # ---------------------------------------------------------------- certificates
  /certificates:
    get:
      tags: [certificates]
      operationId: listCertificates
      summary: List certificates
      description: Only certificates of CAs the caller may read; newest first.
      x-required-role: viewer
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: ca_id
          description: "Only certificates issued by this CA (404 if the caller may not read it)"
          in: query
          schema: { $ref: "#/components/schemas/ID" }
        - name: status
          description: "Only certificates with this status"
          in: query
          schema: { $ref: "#/components/schemas/CertificateStatus" }
        - name: preset
          description: "Only certificates issued with this preset"
          in: query
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
        - name: expires_before
          in: query
          description: Only certificates whose notAfter is before this time
          schema: { type: string, format: date-time }
        - name: q
          in: query
          description: |
            Part of the CN, a SAN or the serial number, any case. A plain substring – `%` and `_`
            are ordinary characters, not wildcards.
          schema: { type: string, maxLength: 253 }
      responses:
        "200":
          description: Certificates, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CertificateList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [certificates]
      operationId: issueCertificate
      summary: Issue a certificate from a CSR or with a server-generated key
      description: |
        Exactly one of `csr_pem` or `key` must be given.
        - With a CSR (preferred): the private key never leaves the requester. Only the names are
          taken from the CSR (unless `use_csr_sans` is false); extensions come from the preset.
        - With `key`: the server generates the key and stores it encrypted, so it can be
          downloaded later (step-up + audit) – the legacy pki.sh workflow; only if the tenant
          allows server-side keys.
        Names are checked against the CA's name constraints before signing. Needs an unsealed
        server (503 `sealed` otherwise).
      x-required-role: operator
      requestBody:
        description: "CA, preset and names, plus either a CSR or the key algorithm for a server-generated key"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IssueRequest" }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCertificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }

  /certificates/{certificateId}:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    get:
      tags: [certificates]
      operationId: getCertificate
      summary: Get certificate details
      x-required-role: viewer
      responses:
        "200":
          description: Certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /certificates/{certificateId}/download/{format}:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
      - name: format
        in: path
        required: true
        description: |
          `pem` = certificate only; `chain` = the intermediates from the issuing CA up to just below
          the root; `fullchain` = certificate + intermediates (like certbot – what nginx, Traefik and
          Caddy serve); `der` = binary certificate. The root is never part of a chain: clients already
          have it as trust anchor (RFC 8446 §4.4.2), and sending it costs bytes and gives SSL Labs'
          "chain contains anchor". Get the root from `GET /cas/{caId}/certificate`.
        schema:
          type: string
          enum: [pem, chain, fullchain, der]
    get:
      tags: [certificates]
      operationId: downloadCertificate
      summary: Download public parts (no private key)
      x-required-role: viewer
      responses:
        "200":
          description: File (Content-Disposition attachment)
          content:
            application/pem-certificate-chain:
              schema: { type: string }
            application/pkix-cert:
              schema: { type: string, contentEncoding: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /certificates/{certificateId}/export:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      tags: [certificates]
      operationId: exportCertificateWithKey
      summary: Download the private key of a server-generated key
      description: |
        Only for certificates with a server-generated key, only for an operator of the issuing CA
        with a fresh second factor, only while unsealed. Formats: `pkcs12` (with `password`, at least
        12 characters: PBES2/AES-256-CBC key, HMAC-SHA256 MAC – Windows 10 1709+, macOS, Java,
        OpenSSL), `pkcs8-pem` (the key alone, unencrypted, over TLS) and `combined-pem`
        (certificate, chain and key in one file – HAProxy). Every download is audited
        (`key.download`) before the key leaves; the response is `Cache-Control: no-store` and an
        attachment. With `delete_key_after_download` the key is destroyed on the server afterwards
        (`key.destroy`, header `X-Key-Deleted: true`); later exports answer 409. Older backups still
        hold the (encrypted) key.
      x-required-role: operator
      x-step-up: true
      requestBody:
        description: "Export format"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "200":
          description: The file (Content-Disposition attachment)
          headers:
            X-Key-Deleted:
              description: "true when the key was destroyed on the server after this download"
              schema: { type: string, enum: ["true"] }
          content:
            application/x-pem-file:
              schema: { type: string }
            application/x-pkcs12:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Sealed" }

  /certificates/{certificateId}/revoke:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      tags: [certificates]
      operationId: revokeCertificate
      summary: Revoke a certificate (irreversible)
      description: |
        The CRL of the issuing CA is signed again at once. While the server is sealed the
        revocation is stored and audited, and the CRL follows at the unseal (`crl_published`
        false). `certificateHold` is not offered (final reasons only). keyCompromise blocks the key
        for every later request.
      x-required-role: operator
      x-step-up: true
      requestBody:
        description: "Revocation reason and optional invalidity date"
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevokeRequest" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevocationResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  /certificates/{certificateId}/renew:
    parameters:
      - $ref: "#/components/parameters/CertificateId"
    post:
      tags: [certificates]
      operationId: renewCertificate
      summary: Issue a successor with the same names, preset and CA
      description: |
        The successor always gets a new key: a server-generated one when the original had one,
        otherwise from `csr_pem` (required then). With `revoke_previous` the original is revoked
        as superseded afterwards (needs the step-up of a revocation, checked first).
      x-required-role: operator
      requestBody:
        description: "Options for the successor; an empty body is fine for server-generated keys"
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RenewRequest" }
      responses:
        "201":
          description: New certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IssuedCertificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }
        "503": { $ref: "#/components/responses/Sealed" }

  /csr/inspect:
    post:
      tags: [certificates]
      operationId: inspectCSR
      summary: Parse a CSR and show what it asks for – nothing is issued
      description: |
        Lets the UI preview a CSR (untrusted input) before issuing. The signature is verified; a
        broken CSR is a policy violation. Needs the operator role on one CA at least.
      x-required-role: operator
      requestBody:
        description: "PKCS#10 request in PEM (untrusted input)"
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csr_pem]
              additionalProperties: false
              properties:
                csr_pem: { type: string, maxLength: 65536 }
      responses:
        "200":
          description: Parsed request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CSRInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  # ---------------------------------------------------------------- imports
  /imports/legacy:
    post:
      tags: [imports]
      operationId: startLegacyImport
      summary: Import a pki.sh directory (tar.gz or zip of ./pki)
      description: |
        Runs in the background. Serial numbers, revocations (status, reason, time) and CRL
        numbers are preserved so existing CRLs and OCSP answers stay correct. Passphrases of
        encrypted CA keys are passed as form fields `ca_passphrase[<name>]` and never stored.
      x-required-role: admin
      x-step-up: true
      requestBody:
        description: "Archive of the pki.sh directory plus passphrases of encrypted CA keys"
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/LegacyImportUpload" }
      responses:
        "202":
          description: Import started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Sealed" }

  /imports/{importId}:
    get:
      tags: [imports]
      operationId: getImport
      summary: Progress and result of an import
      x-required-role: admin
      parameters:
        - name: importId
          description: "ID returned when the import was started"
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ID" }
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /imports/external-certificate:
    post:
      tags: [imports]
      operationId: importExternalCertificate
      summary: Add a certificate from another CA for expiry monitoring
      description: "Stored with `source: external`; never signed, renewed or revoked by this server."
      x-required-role: admin
      requestBody:
        description: "One certificate in PEM"
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate_pem]
              additionalProperties: false
              properties:
                certificate_pem: { type: string, maxLength: 65536 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Certificate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/PolicyViolation" }

  # ---------------------------------------------------------------- audit
  /audit:
    get:
      tags: [audit]
      operationId: listAuditEntries
      summary: Read the audit log (newest first)
      x-required-role: admin
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: action
          description: "Only entries with this action, for example `certificate.revoke`"
          in: query
          schema: { type: string, maxLength: 64 }
        - name: actor
          description: "Only entries of this actor (user name, token or account)"
          in: query
          schema: { type: string, maxLength: 128 }
        - name: since
          description: "Only entries at or after this time (UTC)"
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /audit/verify:
    post:
      tags: [audit]
      operationId: verifyAuditChain
      summary: Walk the hash chain and report the first broken entry, if any
      x-required-role: admin
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerifyResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-myownpki_session
      description: Server-side session; HttpOnly, Secure, SameSite=Strict.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Synchronizer token for every state-changing request with a session cookie.
    bearer:
      type: http
      scheme: bearer
      description: "API token (`Authorization: Bearer <token>`); scoped and expiring."

  parameters:
    Limit:
      description: "Maximum number of items per page"
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque value from `next_cursor` of the previous page
      schema: { type: string, maxLength: 512 }
    UserId:
      description: "ID of the user"
      name: userId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    CAId:
      description: "ID of the CA"
      name: caId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    CertificateId:
      description: "ID of the certificate"
      name: certificateId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }

  responses:
    BadRequest:
      description: Malformed request or invalid fields
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
    Unauthorized:
      description: Not logged in, session expired or invalid token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: Role too low, or step-up required (type `step-up-required`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Object doesn't exist or is not visible to the caller
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: State doesn't allow the action (e.g. already revoked, already unsealed)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooLarge:
      description: Request body or upload exceeds the size limit
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PolicyViolation:
      description: Request is well-formed but violates policy (name constraints, key policy, CA validity)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
    TooManyRequests:
      description: Rate limit or lockout; see the Retry-After header
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Sealed:
      description: The server is sealed; signing is impossible until unseal
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: A request body that is not `application/json`
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    WrongSecret:
      description: The session (or the pending sign-in) is valid, but the passphrase or code is wrong (type `wrong-secret`)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Busy:
      description: Too many password checks at once; see the Retry-After header
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ID:
      type: string
      description: Opaque identifier
      pattern: "^[0-9A-Za-z_-]{1,64}$"

    Problem:
      type: object
      description: RFC 9457 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: |
            One of `about:blank` or `urn:myownpki:problem:` + bad-request, unauthorized,
            forbidden, step-up-required, not-found, conflict, too-large, unsupported-media-type,
            policy-violation, wrong-secret, rate-limited, busy, sealed, internal
          examples: ["urn:myownpki:problem:step-up-required"]
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        request_id:
          type: string
          description: Correlates with server logs (also the X-Request-ID header)

    ValidationProblem:
      description: "Problem details with one entry per invalid field"
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    description: JSON pointer to the offending field
                  message: { type: string }

    SystemStatus:
      description: "Server version, seal state and server time (UTC)"
      type: object
      required: [version, sealed, demo, server_time]
      properties:
        version: { type: string }
        sealed: { type: boolean }
        sealed_since:
          type: [string, "null"]
          format: date-time
          description: Since when signing is impossible; null while unsealed
        demo:
          type: boolean
          description: Made by `init --demo` – all secrets in one file, not for production
        server_time: { type: string, format: date-time }

    UnsealRequest:
      description: "Passphrase that unlocks the online CA keys"
      type: object
      required: [passphrase]
      additionalProperties: false
      properties:
        passphrase: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }

    LoginRequest:
      description: "First login factor"
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }

    LoginResponse:
      description: "Result of the first factor – a second factor is always required"
      type: object
      required: [second_factor_required, methods, pending_expires_at]
      properties:
        second_factor_required: { type: boolean, const: true }
        methods:
          type: array
          description: "totp (a recovery code works in its place); webauthn when the user has a passkey and the server has auth.passkey_origin"
          items: { type: string, enum: [totp, webauthn] }
        first_totp:
          type: boolean
          description: The authenticator was never confirmed – this sign-in completes the setup from init or reset-2fa
        pending_expires_at:
          type: string
          format: date-time
          description: The second factor must follow before this time (5 minutes)

    TOTPRequest:
      description: "TOTP or recovery code for the second factor"
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            6-digit TOTP code (a space in the middle is fine) or a recovery code
            (20 characters in groups of five, any case, hyphens or spaces optional)
          pattern: "^([0-9]{3} ?[0-9]{3}|[0-9A-Za-z]{5}([- ]?[0-9A-Za-z]{5}){3})$"
          writeOnly: true

    StepUpRequest:
      description: "A fresh TOTP code for a sensitive action"
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: 6-digit TOTP code (a space in the middle is fine)
          pattern: "^[0-9]{3} ?[0-9]{3}$"
          writeOnly: true

    TOTPEnrollment:
      description: "Secret for the authenticator app – returned once"
      type: object
      required: [otpauth_uri]
      properties:
        otpauth_uri: { type: string, description: "otpauth:// URI for the QR code – shown once" }

    RecoveryCodes:
      description: "One-time recovery codes for when the authenticator is lost"
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          description: Shown exactly once; stored only as hashes
          items: { type: string }

    CurrentPassword:
      description: "The current password, for changes to the own account"
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 1024 }

    WebAuthnPasskey:
      description: "A registered passkey (no key material)"
      type: object
      required: [id, name, created_at, last_used_at]
      additionalProperties: false
      properties:
        id: { type: string }
        name: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    WebAuthnOptions:
      type: object
      description: WebAuthn options as JSON (passed unchanged to the browser API)
      additionalProperties: true

    WebAuthnCredential:
      type: object
      description: Credential returned by the browser API, serialized as JSON
      additionalProperties: true

    Session:
      description: "The signed-in user, roles and session lifetimes"
      type: object
      required: [user, roles, idle_expires_at, absolute_expires_at, step_up_valid_until, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/SessionUser" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }
        idle_expires_at:
          type: string
          format: date-time
          description: The session ends at this time without activity (30 minutes idle)
        absolute_expires_at:
          type: string
          format: date-time
          description: The session ends at this time in any case (12 hours after sign-in)
        step_up_valid_until:
          type: [string, "null"]
          format: date-time
        csrf_token:
          type: string
          description: Send it as X-CSRF-Token on every state-changing request
        recovery_codes_left:
          type: integer
          minimum: 0
          description: Only after a sign-in with a recovery code
        warnings:
          type: array
          items: { type: string }

    SessionUser:
      description: "Who is signed in"
      type: object
      required: [id, username, instance_admin]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        username: { type: string }
        instance_admin:
          type: boolean
          description: May unseal and manage users – gives no rights in a tenant

    Role:
      description: "Role, from least to most rights – viewer, operator, admin"
      type: string
      enum: [viewer, operator, admin]

    RoleBinding:
      description: "A role granted on a scope (the tenant or one CA)"
      type: object
      required: [role, scope]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        scope:
          type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [tenant, ca]
              description: Domain and agent-group scopes follow in phases 2 and 3
            id:
              $ref: "#/components/schemas/ID"

    User:
      description: "A local user account"
      type: object
      required: [id, username, disabled, created_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        username: { type: string }
        display_name: { type: string }
        email: { type: string, format: email }
        disabled: { type: boolean }
        mfa:
          type: object
          properties:
            totp: { type: boolean }
            webauthn_credentials: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, "null"], format: date-time }

    UserList:
      description: "One page of users"
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/User" }
        next_cursor: { type: [string, "null"] }

    UserCreate:
      description: "A new local user"
      type: object
      required: [username, password, roles]
      properties:
        username: { type: string, pattern: "^[a-z0-9._-]{2,64}$" }
        display_name: { type: string, maxLength: 128 }
        email: { type: string, format: email }
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
          description: Initial password; the user must change it at first login
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleBinding" }

    UserUpdate:
      description: "Changes to a user (at least one field)"
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, maxLength: 128 }
        email: { type: string, format: email }
        disabled: { type: boolean }

    PasswordChange:
      description: "Password change of the logged-in user"
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password, writeOnly: true, maxLength: 1024 }
        new_password: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 1024 }

    APIToken:
      description: "An API token without its secret"
      type: object
      required: [id, name, scopes, created_at, expires_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/TokenScope" }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }

    TokenScope:
      description: "What an API token may do; never more than its owner"
      type: string
      enum: [certificates:read, certificates:issue, certificates:revoke, cas:read, audit:read]

    APITokenCreate:
      description: "A new API token"
      type: object
      required: [name, scopes, expires_in_days]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        scopes:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TokenScope" }
        expires_in_days: { type: integer, minimum: 1, maximum: 365 }

    APITokenCreated:
      description: "A new API token including the secret – returned once"
      allOf:
        - $ref: "#/components/schemas/APIToken"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret – shown exactly once, stored only as a hash

    SANType:
      description: "Kind of subject alternative name"
      type: string
      enum: [dns, ip, email, uri]

    Preset:
      type: object
      description: Mirrors presets/*.yaml (see presets/README.md)
      required: [name, description, family, validity_days, key_usage, ext_key_usage, subject_alt_names, openssl_purpose, ocsp_no_check, customizable]
      properties:
        name: { type: string }
        description: { type: string }
        usage: { type: string }
        family: { type: string, enum: [server, vpnserver, client, codesign, ocsp, timestamp, custom] }
        validity_days: { type: integer }
        key_usage:
          type: object
          required: [rsa, other]
          properties:
            rsa: { type: array, items: { type: string } }
            other: { type: array, items: { type: string } }
        ext_key_usage:
          type: object
          required: [usages, critical]
          properties:
            usages: { type: array, items: { type: string } }
            critical: { type: boolean }
        subject_alt_names:
          type: object
          required: [required_any_of, offered]
          properties:
            required_any_of: { type: array, items: { $ref: "#/components/schemas/SANType" } }
            offered: { type: array, items: { $ref: "#/components/schemas/SANType" } }
        common_name_from: { type: string, enum: ["", dns, email] }
        openssl_purpose: { type: string }
        ocsp_no_check: { type: boolean }
        customizable: { type: boolean }
        wildcard:
          type: boolean
          description: DNS names like *.example.com are allowed and at least one is required

    KeyAlgorithm:
      type: string
      description: |
        Key type and size of a certificate's key. ecdsa-p256 is the default for leaves. Ed25519
        server certificates are not accepted by browsers; rsa-2048 is flagged as compatibility only
        (BSI TR-02102 recommends 3000 bit or more). RSA keys from a CSR may have other sizes (2048-8192).
      pattern: "^(ecdsa-p256|ecdsa-p384|ecdsa-p521|ed25519|rsa-[0-9]{4})$"

    GeneratedKeyAlgorithm:
      type: string
      description: Key algorithms the server generates (server-side keys)
      enum: [ecdsa-p256, ecdsa-p384, ecdsa-p521, ed25519, rsa-2048, rsa-3072, rsa-4096]

    Subject:
      description: "Distinguished name parts of a certificate subject"
      type: object
      required: [common_name]
      properties:
        common_name: { type: string, minLength: 1, maxLength: 64 }
        organization: { type: string, maxLength: 64 }
        organizational_unit: { type: string, maxLength: 64 }
        locality: { type: string, maxLength: 128 }
        state: { type: string, maxLength: 128 }
        country: { type: string, pattern: "^[A-Z]{2}$" }

    SANs:
      description: "Subject alternative names, grouped by kind"
      type: object
      properties:
        dns:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 253 }
        ip:
          type: array
          maxItems: 100
          items: { type: string, description: "IPv4 or IPv6 address" }
        email:
          type: array
          maxItems: 100
          items: { type: string, format: email }
        uri:
          type: array
          maxItems: 100
          items: { type: string, format: uri }

    NameConstraints:
      type: object
      description: |
        Limits which names this CA may sign for. Marked critical by default (RFC 5280); enforced
        by the server before signing as well, not only by clients.
      properties:
        permitted_dns:
          type: array
          items: { type: string, description: "e.g. .homelab.lan or homelab.lan" }
        permitted_ip:
          type: array
          items: { type: string, description: "CIDR, IPv4 or IPv6" }
        critical: { type: boolean, default: true }

    CAKind:
      description: "Root (self-signed) or intermediate CA"
      type: string
      enum: [root, intermediate]

    CAStatus:
      description: "Lifecycle state of a CA"
      type: string
      enum: [active, pending_signature, expired, revoked, retired]

    KeyMode:
      type: string
      description: ADR-09 – offline (certificate only), online_encrypted (unseal needed), hsm
      enum: [offline, online_encrypted, hsm]

    CA:
      description: "A certificate authority of this tenant with its generations (one per key)"
      type: object
      required: [id, name, kind, status, key_mode, parent, public_base_url, crl_days, max_validity_days,
                 path_len, name_constraints, name_constraints_critical, eku_limit, current_generation, generations]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        name: { type: string }
        kind: { $ref: "#/components/schemas/CAKind" }
        status: { $ref: "#/components/schemas/CAStatus" }
        key_mode: { $ref: "#/components/schemas/KeyMode" }
        parent:
          type: [string, "null"]
          description: Name of the parent CA; null for a root
        public_base_url:
          type: string
          format: uri
          description: Base of AIA/CRL URLs in issued certificates – immutable after the first issuance
        crl_days: { type: integer, minimum: 1 }
        max_validity_days: { type: integer, minimum: 1 }
        path_len: { type: [integer, "null"], minimum: 0 }
        name_constraints:
          type: array
          items: { $ref: "#/components/schemas/NameConstraint" }
        name_constraints_critical: { type: boolean }
        eku_limit:
          type: array
          description: EKUs this CA may issue (names, or OIDs for unnamed ones); empty = no limit
          items: { type: string }
        current_generation:
          type: [integer, "null"]
          minimum: 1
          description: The generation that signs; null while the first waits for its offline signature
        generations:
          type: array
          items: { $ref: "#/components/schemas/CAGeneration" }

    NameConstraint:
      description: "One name constraint of a CA"
      type: object
      required: [mode, type, value]
      properties:
        mode: { type: string, enum: [permitted, excluded] }
        type: { type: string, enum: [dns, ip, email] }
        value: { type: string }

    CAGeneration:
      description: "One key and certificate of a CA"
      type: object
      required: [generation, current, pending, key_algorithm, subject, issuer, certificate_url, crl_url, warnings]
      properties:
        generation: { type: integer, minimum: 1 }
        current: { type: boolean }
        pending:
          type: boolean
          description: Waits for the certificate from the offline root
        key_algorithm: { $ref: "#/components/schemas/KeyAlgorithm" }
        subject: { type: string, description: Subject DN as an RFC 4514 string }
        serial: { type: string, pattern: "^[0-9A-F]+$" }
        fingerprint_sha256: { type: string, pattern: "^[0-9A-F]{64}$" }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        issuer:
          type: [string, "null"]
          description: Parent CA and generation, e.g. `root/1`; null for a root
        certificate_url: { type: string, format: uri, description: Where MyOwnPKI publishes this certificate (AIA) }
        crl_url: { type: string, format: uri, description: Where MyOwnPKI publishes its CRL (CDP) }
        revoked:
          type: [string, "null"]
          description: "`<reason> on <date>` for a revoked generation"
        warnings:
          type: array
          items: { type: string }
        crl: { $ref: "#/components/schemas/CRLInfo" }

    CACreate:
      description: "A CA to create"
      type: object
      required: [name, kind, subject, key_algorithm, validity_days, public_base_url]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        kind: { $ref: "#/components/schemas/CAKind" }
        subject: { $ref: "#/components/schemas/Subject" }
        key_algorithm: { $ref: "#/components/schemas/KeyAlgorithm" }
        validity_days: { type: integer, minimum: 1, maximum: 9125 }
        issuer_ca_id: { $ref: "#/components/schemas/ID" }
        offline_signing:
          type: boolean
          default: false
          description: Create key + CSR only; the certificate comes from an offline root
        path_len: { type: integer, minimum: 0, default: 0 }
        name_constraints: { $ref: "#/components/schemas/NameConstraints" }
        eku_limit: { type: array, items: { type: string } }
        public_base_url: { type: string, format: uri }

    CACreated:
      description: "A created CA, with the CSR when it waits for offline signing"
      allOf:
        - $ref: "#/components/schemas/CA"
        - type: object
          properties:
            csr_pem:
              type: string
              description: Only with offline_signing – sign it on the offline root

    CAImport:
      description: "An existing CA to import"
      type: object
      required: [name, certificate]
      properties:
        name: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        certificate: { type: string, contentMediaType: application/x-pem-file }
        private_key:
          type: string
          contentMediaType: application/x-pem-file
          description: Optional; encrypted PEM recommended
        key_passphrase: { type: string, format: password, writeOnly: true }
        public_base_url: { type: string, format: uri }

    SignedCAUpload:
      description: "Certificate of an offline-signed intermediate"
      type: object
      required: [certificate_pem]
      properties:
        certificate_pem: { type: string, maxLength: 65536 }
        chain_pem: { type: string, maxLength: 262144 }

    CRLInfo:
      description: "The newest CRL of a CA generation and what it needs"
      type: object
      required: [state, number, unpublished]
      properties:
        state:
          type: string
          enum: [ok, renew_due, warning, expired, missing]
          description: renew_due after a third of the lifetime, warning from half, expired after nextUpdate
        number: { type: integer, minimum: 0, description: "Strictly increasing per CA; 0 = none yet" }
        source: { type: string, enum: [signed, uploaded] }
        this_update: { type: string, format: date-time }
        next_update: { type: string, format: date-time }
        unpublished:
          type: integer
          minimum: 0
          description: Revocations not on the newest CRL yet – they take effect only once a CRL lists them
        message:
          type: string
          description: What an admin should know; absent when all is well

    CertificateStatus:
      description: "Validity state of a certificate"
      type: string
      enum: [valid, revoked, expired]

    RevocationReason:
      type: string
      description: RFC 5280 §5.3.1 (certificateHold intentionally not offered)
      enum: [unspecified, keyCompromise, cACompromise, affiliationChanged, superseded, cessationOfOperation, privilegeWithdrawn]

    Certificate:
      description: "An end-entity certificate known to this tenant"
      type: object
      required: [id, ca_id, ca_name, status, source, subject, common_name, sans, serial, not_before, not_after,
                 key_algorithm, fingerprint_sha256, key_stored, created_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        ca_id: { type: [string, "null"], description: "null for external certificates" }
        ca_name: { type: [string, "null"] }
        ca_generation: { type: [integer, "null"], minimum: 1 }
        preset: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/CertificateStatus" }
        source:
          type: string
          enum: [issued, imported, external]
        subject: { type: string, description: Subject DN as an RFC 4514 string }
        common_name: { type: string, description: "Empty when the certificate has no CN" }
        sans: { $ref: "#/components/schemas/SANs" }
        serial: { type: string, pattern: "^[0-9A-F]+$" }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        key_algorithm: { $ref: "#/components/schemas/KeyAlgorithm" }
        key_stored:
          type: boolean
          description: The server holds the (encrypted) private key – only for server-generated keys
        fingerprint_sha256: { type: string, pattern: "^[0-9A-F]{64}$" }
        revocation:
          type: [object, "null"]
          required: [reason, revoked_at]
          properties:
            reason: { $ref: "#/components/schemas/RevocationReason" }
            revoked_at: { type: string, format: date-time }
            invalidity_date: { type: [string, "null"], format: date-time }
        renewal_of: { type: [string, "null"] }
        issued_by: { type: [string, "null"], description: User or token that requested it }
        created_at: { type: string, format: date-time }

    CertificateList:
      description: "One page of certificates"
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Certificate" }
        next_cursor: { type: [string, "null"] }

    IssueRequest:
      description: "Request to issue a certificate; exactly one of `csr_pem` or `key`"
      type: object
      required: [ca_id, preset]
      additionalProperties: false
      oneOf:
        - required: [csr_pem]
        - required: [key]
      properties:
        ca_id: { $ref: "#/components/schemas/ID" }
        preset: { type: string, pattern: "^[a-z][a-z0-9-]{0,62}$" }
        subject: { $ref: "#/components/schemas/Subject" }
        sans: { $ref: "#/components/schemas/SANs" }
        validity_days:
          type: integer
          minimum: 1
          description: Defaults to the preset; capped by the CA's limit and its own notAfter
        csr_pem: { type: string, maxLength: 65536 }
        use_csr_sans:
          type: boolean
          default: true
          description: false = ignore names in the CSR, use only `sans` (legacy --no-csr-san)
        key:
          type: object
          required: [algorithm]
          additionalProperties: false
          properties:
            algorithm: { $ref: "#/components/schemas/GeneratedKeyAlgorithm" }
        key_usage:
          type: array
          items: { type: string }
          description: Key usages – only for customizable presets; validated like preset files
        ext_key_usage:
          type: array
          items: { type: string }
          description: Extended key usages – only for customizable presets; validated like preset files

    IssuedCertificate:
      description: "A new certificate, with what the server changed or dropped"
      allOf:
        - $ref: "#/components/schemas/Certificate"
        - type: object
          required: [notes, warnings, dropped_csr_names]
          properties:
            notes:
              type: array
              description: Defaults that changed the request (validity shortened, base domain added)
              items: { type: string }
            warnings:
              type: array
              description: Compatibility problems that didn't stop the issuance
              items: { type: string }
            dropped_csr_names:
              type: array
              description: Names from the CSR the preset doesn't take, as `type:value`
              items: { type: string }

    RevokeRequest:
      description: "Request to revoke a certificate"
      type: object
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/RevocationReason" }
        invalidity_date:
          type: string
          format: date-time
          description: When the key is known or suspected to have been compromised

    RenewRequest:
      description: "Options for renewing a certificate"
      type: object
      additionalProperties: false
      properties:
        csr_pem:
          type: string
          maxLength: 65536
          description: Required when the original was issued from a CSR; refused otherwise
        key_algorithm:
          type: string
          description: New server key algorithm; default the original's
        revoke_previous:
          type: boolean
          default: false
          description: Revoke the old certificate with reason superseded (step-up as for a revocation)
        validity_days: { type: integer, minimum: 1 }

    RevocationResult:
      description: "A revocation and whether a CRL lists it already"
      type: object
      required: [certificate, crl_published, crl_number, warnings]
      additionalProperties: false
      properties:
        certificate: { $ref: "#/components/schemas/Certificate" }
        crl_published:
          type: boolean
          description: false while sealed – the CRL is signed at the unseal; only then clients see it
        crl_number: { type: [integer, "null"] }
        warnings:
          type: array
          items: { type: string }

    ExportRequest:
      description: "Request to export the private key of a server-generated key"
      type: object
      required: [format]
      additionalProperties: false
      properties:
        format:
          type: string
          enum: [pkcs12, pkcs8-pem, combined-pem]
          description: |
            pkcs12 = key, certificate and chain, protected by `password`; pkcs8-pem = the key alone,
            unencrypted; combined-pem = certificate, chain and key in one PEM file.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 1024
          description: Required for pkcs12, refused for the other formats
        delete_key_after_download:
          type: boolean
          default: false
          description: Destroy the key on the server once the file is built and the download audited

    CSRInfo:
      description: "What a CSR asks for, parsed for preview"
      type: object
      required: [subject, common_name, sans, key_algorithm, signature_valid, requested_extensions, problems, warnings]
      additionalProperties: false
      properties:
        subject: { type: string }
        common_name: { type: string }
        sans: { $ref: "#/components/schemas/SANs" }
        key_algorithm: { type: string }
        signature_valid: { type: boolean }
        requested_extensions:
          type: array
          description: Shown for information only – extensions are never copied from a CSR
          items: { type: string }
        problems:
          type: array
          description: What the key policy refuses (an issuance would be denied)
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    LegacyImportUpload:
      description: "Upload of a legacy pki.sh directory"
      type: object
      required: [archive]
      properties:
        archive:
          type: string
          contentMediaType: application/octet-stream
          description: tar.gz or zip of the pki/ directory (size-limited, zip-slip safe)
        dry_run:
          type: boolean
          default: false
          description: Only analyse and report, write nothing
      additionalProperties:
        type: string
        description: "ca_passphrase[<name>] fields for encrypted CA keys"

    ImportJob:
      description: "State and result of a legacy import"
      type: object
      required: [id, status]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        dry_run: { type: boolean }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        summary:
          type: object
          properties:
            cas: { type: integer }
            certificates: { type: integer }
            revoked: { type: integer }
            keys_imported: { type: integer }
        problems:
          type: array
          items:
            type: object
            required: [severity, message]
            properties:
              severity: { type: string, enum: [info, warning, error] }
              path: { type: string, description: File inside the archive }
              message: { type: string }

    AuditEntry:
      description: "One entry of the hash-chained audit log"
      type: object
      required: [seq, time, actor, action, result, hash, prev_hash]
      properties:
        seq: { type: integer, minimum: 1 }
        time: { type: string, format: date-time }
        actor:
          type: object
          required: [type]
          properties:
            type: { type: string, enum: [user, token, system, acme_account, agent] }
            id: { type: string }
            name: { type: string }
        action: { type: string, examples: ["certificate.revoke"] }
        target:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
        result: { type: string, enum: [success, failure, denied] }
        source_ip: { type: string }
        details:
          type: object
          additionalProperties: true
          description: Never contains secrets or key material
        hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        prev_hash: { type: string, pattern: "^[0-9a-f]{64}$" }

    AuditList:
      description: "One page of audit entries"
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEntry" }
        next_cursor: { type: [string, "null"] }

    AuditVerifyResult:
      description: "Result of walking the audit hash chain"
      type: object
      required: [ok, entries_checked]
      properties:
        ok: { type: boolean }
        entries_checked: { type: integer, minimum: 0 }
        first_broken_seq: { type: [integer, "null"] }
