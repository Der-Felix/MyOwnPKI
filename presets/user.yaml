# Personal identity: log in (clientAuth) and sign/encrypt e-mail (emailProtection).
#
# nonRepudiation (RFC 5280: contentCommitment) marks signatures the person stands
# behind, as opposed to automatic signatures during a TLS handshake.
# Mail clients find the certificate by the e-mail address in the SAN -> required.
name: user
description: "User Identity: Client authentication + S/MIME combined (Login + Email signing & encryption)"
usage: "Import cert.p12 into mail client and operating system keychain / certificate store"
family: client
validity_days: 730
key_usage:
  rsa: [digitalSignature, nonRepudiation, keyEncipherment]
  other: [digitalSignature, nonRepudiation]
ext_key_usage:
  usages: [clientAuth, emailProtection]
  critical: false
subject_alt_names:
  required_any_of: [email]
  offered: [email]
common_name_from: email
openssl_purpose: sslclient
ocsp_no_check: false
customizable: false
