# Code signing – PowerShell scripts, binaries, packages, Git commits, containers.
#
# Only digitalSignature: a code signing key never encrypts anything.
# Longer validity (3 years) because signatures are usually timestamped (see the
# "timestamp" preset) and stay valid after the certificate expires.
name: codesign
description: "Code Signing: PowerShell scripts, binaries, packages, Git commit & container signatures"
usage: "PowerShell: Set-AuthenticodeSignature with cert.p12 | osslsigncode | openssl cms"
family: codesign
validity_days: 1095
key_usage:
  rsa: [digitalSignature]
  other: [digitalSignature]
ext_key_usage:
  usages: [codeSigning]
  critical: false
subject_alt_names:
  required_any_of: []
  offered: []
common_name_from: ""
openssl_purpose: any
ocsp_no_check: false
customizable: false
