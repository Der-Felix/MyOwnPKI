# TLS client authentication – mTLS, 802.1X EAP-TLS, browser login, API clients.
#
# clientAuth lets the holder prove its identity *to* a server. Without serverAuth it
# cannot be abused to impersonate a server. No SAN is required: the identity often
# lives in the subject (802.1X, RADIUS) – but DNS or e-mail SANs can be added.
name: client
description: "TLS Client Auth: mTLS, 802.1X EAP-TLS (WiFi/Wired 802.1X), browser login, API clients"
usage: "Browser/Windows/macOS/iOS: import cert.p12 | curl/scripts: --cert cert.pem --key key.pem"
family: client
validity_days: 730
key_usage:
  rsa: [digitalSignature, keyEncipherment]
  other: [digitalSignature]
ext_key_usage:
  usages: [clientAuth]
  critical: false
subject_alt_names:
  required_any_of: []
  offered: [dns, email]
common_name_from: ""
openssl_purpose: sslclient
ocsp_no_check: false
customizable: false
