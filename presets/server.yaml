# TLS server – web servers, reverse proxies, LDAPS, mail, databases.
#
# key_usage: with an RSA key, the classic TLS 1.2 RSA key exchange *encrypts* the
#   session secret with the server's public key -> keyEncipherment. ECDSA and Ed25519
#   keys can only sign, so they get digitalSignature alone.
# subject_alt_names: TLS clients match the hostname only against the SAN; the CN is
#   just a display name. At least one DNS name or IP address is therefore required.
# validity_days: 397 = just under the 398-day limit browsers enforce for public TLS
#   certificates since 2020. Public CAs go lower from 2026 (CA/B Forum SC-081);
#   ported 1:1 from legacy for now.
name: server
description: "TLS Server: Web server, reverse proxy, LDAPS, Proxmox, UniFi, Mail (SMTP/IMAP), Databases"
usage: "nginx/Traefik/Caddy: fullchain.pem + key.pem | HAProxy: combined.pem | Windows/IIS: cert.p12"
family: server
validity_days: 397
key_usage:
  rsa: [digitalSignature, keyEncipherment]
  other: [digitalSignature]
ext_key_usage:
  usages: [serverAuth]
  critical: false
subject_alt_names:
  required_any_of: [dns, ip]
  offered: [dns, ip]
common_name_from: dns
openssl_purpose: sslserver
ocsp_no_check: false
customizable: false
