# S/MIME – e-mail signing and encryption (Outlook, Apple Mail, Thunderbird).
#
# keyEncipherment (RSA only): the sender encrypts the message key with the
# recipient's public key. With ECDSA, S/MIME encryption needs ECDH key agreement
# instead – many mail clients don't support that, so RSA is the safe choice here.
name: smime
description: "S/MIME: Email signing and encryption (Outlook, Apple Mail, Thunderbird)"
usage: "Import cert.p12 into mail client; recipients must trust the Root or Intermediate CA"
family: client
validity_days: 730
key_usage:
  rsa: [digitalSignature, nonRepudiation, keyEncipherment]
  other: [digitalSignature, nonRepudiation]
ext_key_usage:
  usages: [emailProtection]
  critical: false
subject_alt_names:
  required_any_of: [email]
  offered: [email]
common_name_from: email
openssl_purpose: smimesign
ocsp_no_check: false
customizable: false
