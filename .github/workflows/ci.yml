# Continuous integration for MyOwnPKI.
#
# Security posture of this workflow:
# - read-only token (permissions: contents: read), no secrets used
# - third-party actions pinned to a full commit SHA (tags can be moved)
# - downloaded tools are verified against pinned SHA-256 checksums
# - GOTOOLCHAIN=local: CI never silently downloads a different Go version
#
# Pinned versions must match Taskfile.yml – `task tools:check` fails otherwise.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily vulnerability scan: new advisories appear without any code change.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Runs on main always finish; superseded runs of branches and PRs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.27.3"
  TASK_VERSION: "3.54.0"
  GOLANGCI_LINT_VERSION: "2.14.0"
  GOLANGCI_LINT_SHA256: "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab"
  SQLC_VERSION: "1.31.1"
  SQLC_SHA256: "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  VACUUM_VERSION: "0.30.6"
  VACUUM_SHA256: "179f038a71cd88721738d6c739dd07fbeebc905b48301935f2416e66aead95c6"
  # The same pin as in release.yml (the install job builds a snapshot).
  GORELEASER_VERSION: "2.18.2"
  GORELEASER_SHA256: "0a96edc9d9bc594e4a41cc4d59467c182062910ab24d9d1f6dd7b667d32606d3"
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  check:
    name: check (fmt, lint, test, build, generated code)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          golangci-lint: "true"
          sqlc: ${{ hashFiles('sqlc.yaml') != '' }}
      # The output also goes to a file: on a failure the next step turns the
      # failed tests into annotations, readable without signing in.
      - name: task check
        run: |
          set -o pipefail
          task check 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Failed tests as annotations
        if: failure()
        run: |
          if [ ! -s "$RUNNER_TEMP/test.log" ]; then exit 0; fi
          printf '### Failed tests – %s\n\n' "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/failed-tests.sh "$RUNNER_TEMP/test.log" "$GITHUB_STEP_SUMMARY"
      - run: task generate:check
      - name: Agent protocol stays compatible with main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git cat-file -e origin/main:buf.yaml 2>/dev/null; then
            go run ./internal/tools/buf breaking --against '.git#branch=origin/main'
          else
            echo 'main has no agent protocol yet; the introduction in v0.3.0 is the compatibility baseline'
          fi
      - name: Fuzz the ACME JWS parser (short run)
        run: task fuzz
      # The previous release (Taskfile UPGRADE_FROM) makes an instance and a
      # backup; this build restores, migrates and issues by ACME.
      - name: Upgrade test from the previous release
        run: task upgrade:test

  race:
    name: tests with race detector
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # A hang ends as a clear timeout (a normal run takes a few minutes).
    timeout-minutes: 20
    env:
      # The race detector needs cgo (gcc is preinstalled on the runner). Only this
      # job – release binaries stay pure Go (ADR-01, verified by task build:verify).
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # go test -json streams every package's events as they happen; plain
      # `go test ./...` holds a package's output back until the package ends,
      # so a run killed in the middle showed only "ok …/api". The JSON goes to
      # a file for the next step, the log gets readable text (started
      # packages, ok lines, everything of a failed package). Memory is logged
      # every 15 s: -race needs several times the memory of a plain run.
      - name: task test:race
        run: |
          set -o pipefail
          while sleep 15; do
            free -m | awk -v t="$(date -u +%T)" '/^Mem:/ { printf "memory %s UTC: %d of %d MiB used, %d available\n", t, $3, $2, $7 }' |
              tee -a "$RUNNER_TEMP/memory.log"
          done &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          task --silent test:race -- -json | tee "$RUNNER_TEMP/test.json" | bash .github/scripts/failed-tests.sh --text
      # Also after the timeout above: then the run was cancelled, and the
      # report names the tests that had started and not ended.
      - name: Failed tests as annotations
        if: failure() || cancelled()
        run: |
          printf '### Failed tests – %s\n\n' "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/test.json" ]; then
            bash .github/scripts/failed-tests.sh "$RUNNER_TEMP/test.json" "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s "$RUNNER_TEMP/memory.log" ]; then
            {
              printf '\n#### Memory, the last two minutes\n\n```text\n'
              tail -n 8 "$RUNNER_TEMP/memory.log"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # The kernel's OOM killer, if it ended a test binary.
          oom=$(sudo dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -n 5 || true)
          if [ -n "$oom" ]; then
            printf '::error title=out of memory::%s\n' "${oom//$'\n'/%0A}"
          fi

  test-os:
    name: tests on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      # macOS ships LibreSSL as /usr/bin/openssl; the tests need OpenSSL 3
      # (x509 -req -copy_extensions, as in the offline signing instructions).
      - name: OpenSSL 3 from Homebrew (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      # The tests cross-check certificates with `openssl verify` (required
      # in CI); the log shows which OpenSSL that is.
      - name: OpenSSL used by the tests
        shell: bash
        run: command -v openssl && openssl version
      - run: go test ./...
      # The Windows helpers of the trust page (v0.2.2) for real: cmd.exe runs
      # each with /check (no import) – the fingerprint passes, a changed copy
      # and an unknown switch stop before anything is imported. Part of the
      # run above too; its own step so the log shows it.
      - name: Windows helper of the trust page (cmd.exe, /check)
        if: runner.os == 'Windows'
        run: go test -count=1 -run '^TestWindowsHelper' -v ./internal/publish/

  cross:
    name: cross-compile (linux, darwin, windows, freebsd)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task cross

  vuln:
    name: vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task vuln

  lint-meta:
    name: workflows and API spec (actionlint, vacuum)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ShellCheck too: actionlint checks the run: scripts with it.
      - uses: ./.github/actions/setup
        with:
          shellcheck: "true"
          actionlint: "true"
          vacuum: "true"
      - run: task lint:ci
      - run: task lint:api

  shellcheck:
    name: legacy Bash suite (shellcheck, smoke test)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          shellcheck: "true"
      # The lib/*.sh modules share globals: a variable set in one module is
      # read in another. Checked one by one, every such variable looks
      # unused (SC2034), so the modules skip that check; the standalone
      # script contains all modules in one file and runs it for real.
      - name: ShellCheck sources and compiled standalone script
        run: |
          bash legacy/build.sh
          shellcheck --severity=warning --external-sources \
            legacy/*.sh legacy/tests/*.sh legacy/completions/*.bash \
            legacy/dist/pki-standalone.sh .github/scripts/*.sh test/conformance/run.sh \
            deploy/install.sh deploy/install-agent.sh test/install/*.sh
          shellcheck --severity=warning --exclude=SC2034 legacy/lib/*.sh
      - name: Smoke test (modular and standalone script, completion)
        run: bash legacy/tests/smoke.sh

  # Real ACME clients against the ACME server (PHASE2 step 14, owner Q5):
  # its own job because it runs containers (BIND, certbot, acme.sh) and binds
  # port 80. The images are pinned by digest in test/conformance/run.sh; lego
  # and Pebble by version in Taskfile.yml. Nothing of it reaches a release.
  # Since v0.2.2 also lego and certbot directly against the server's own TLS
  # listener (acme.tls_issuer), with the root as the only trust anchor.
  conformance:
    name: ACME conformance (lego, certbot, acme.sh; Pebble as control)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # lego with the in-process test network: EAB, ARI renewal, revoke
      # and the CRL check (the same tests as locally).
      - name: lego walking skeleton, EAB, ARI
        run: task acme:lego
      - name: Conformance run
        env:
          CONF_WORK: ${{ runner.temp }}/conformance
        run: task acme:conformance

  agent-e2e:
    name: agent end-to-end
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download pinned Go modules
        run: go mod download
      - name: install-agent.sh functions (no root)
        run: bash test/install/agent_functions_test.sh
      # The official image carries nginx, not Go. Mount the already installed
      # toolchain and module cache read-only; the test cache is disposable.
      - name: Real server, agent, ACME, Renew now and nginx rollback
        run: |
          goroot=$(go env GOROOT)
          modcache=$(go env GOMODCACHE)
          mkdir -p "$RUNNER_TEMP/agent-go-cache" "$RUNNER_TEMP/agent-tmp"
          docker run --rm --network host \
            --env PATH=/usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env HOME=/tmp --env GOPATH=/tmp/gopath --env GOMODCACHE=/go/pkg/mod \
            --env GOCACHE=/tmp/go-cache --env GOFLAGS=-mod=readonly --env GOTOOLCHAIN=local \
            --env CGO_ENABLED=0 --env MYOWNPKI_REQUIRE_NGINX=1 \
            --volume "$PWD:/src:ro" --volume "$goroot:/usr/local/go:ro" \
            --volume "$modcache:/go/pkg/mod:ro" \
            --volume "$RUNNER_TEMP/agent-go-cache:/tmp/go-cache" \
            --volume "$RUNNER_TEMP/agent-tmp:/tmp" \
            --workdir /src \
            nginx:1.29.2-trixie@sha256:029d4461bd98f124e531380505ceea2072418fdf28752aa73b7b273ba3048903 \
            bash -c 'nginx -v && go test -count=1 -v ./internal/server -run "^(TestAgentEndToEnd|TestRenewNowOverRESTServesNewCertificate)$" && go test -count=1 -v -tags e2etest ./internal/agent -run "^(TestNginxDeployProfiles|TestNginxStagedFaultRollsBack)$"'
      # Measure the production unit before any CI-only drop-ins are installed.
      - name: systemd-analyze verify and security
        run: |
          go build -trimpath -o "$RUNNER_TEMP/myownpki-agent" ./cmd/myownpki-agent
          sudo install -m 0755 "$RUNNER_TEMP/myownpki-agent" /usr/local/bin/myownpki-agent
          sudo install -m 0644 deploy/systemd/myownpki-agent.service /etc/systemd/system/myownpki-agent.service
          sudo systemctl daemon-reload
          systemd-analyze verify /etc/systemd/system/myownpki-agent.service
          systemd-analyze security --no-pager myownpki-agent.service | tee "$RUNNER_TEMP/agent-security.txt"
          exposure=$(sed -n 's/.*Overall exposure level for .*: \([0-9.]*\).*/\1/p' "$RUNNER_TEMP/agent-security.txt")
          [ -n "$exposure" ] || { echo '::error::no overall exposure in systemd-analyze output'; exit 1; }
          {
            printf '### systemd-analyze security myownpki-agent.service\n\nOverall exposure: **%s** (systemd %s)\n\n' \
              "$exposure" "$(systemctl --version | awk 'NR == 1 { print $2 }')"
            printf '<details><summary>All checks</summary>\n\n```text\n'
            cat "$RUNNER_TEMP/agent-security.txt"
            printf '```\n\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

      # Run nginx itself, not a look-alike, under the real unit. Exporting the
      # pinned image supplies its matching loader and libraries; no apt package
      # or second image is needed. Only ExecStart is replaced for this test.
      - name: nginx -t on port 443 under the real systemd unit
        run: |
          image=nginx:1.29.2-trixie@sha256:029d4461bd98f124e531380505ceea2072418fdf28752aa73b7b273ba3048903
          rootfs=/var/lib/myownpki-agent-e2e/rootfs
          container=$(docker create "$image")
          cleanup_agent_e2e() {
            if [ -n "${container:-}" ]; then
              docker rm -f "$container" 2>/dev/null || true
            fi
            sudo systemctl stop myownpki-agent.service >/dev/null 2>&1 || true
            sudo rm -rf /etc/systemd/system/myownpki-agent.service.d \
              /etc/systemd/system/myownpki-agent.service /var/lib/myownpki-agent-e2e \
              /usr/local/bin/myownpki-agent
            sudo systemctl reset-failed myownpki-agent.service >/dev/null 2>&1 || true
            sudo systemctl daemon-reload
          }
          trap cleanup_agent_e2e EXIT
          sudo rm -rf /var/lib/myownpki-agent-e2e
          sudo install -d -m 0755 "$rootfs"
          docker export "$container" | sudo tar -x -C "$rootfs"
          docker rm "$container"
          container=
          go test -c -tags e2etest -o "$RUNNER_TEMP/myownpki-agent-e2e.test" ./internal/agent
          sudo install -D -m 0755 "$RUNNER_TEMP/myownpki-agent-e2e.test" "$rootfs/usr/local/libexec/myownpki-agent-e2e.test"
          sudo install -m 0644 deploy/systemd/myownpki-agent.service /etc/systemd/system/myownpki-agent.service
          sudo install -d -m 0755 /etc/systemd/system/myownpki-agent.service.d
          # systemd.exec(5): ReadWritePaths= is relative to the runner's root
          # unless prefixed with '+'. It does not name a directory in this
          # CI-only RootDirectory. Keep nginx's files in StateDirectory instead.
          # A real host has no RootDirectory and uses 10-paths.conf normally.
          printf '[Service]\nReadWritePaths=/var/lib/myownpki-agent\n' |
            sudo tee /etc/systemd/system/myownpki-agent.service.d/10-paths.conf >/dev/null
          {
            printf '[Service]\n'
            printf 'Restart=no\n'
            printf 'RootDirectory=%s\n' "$rootfs"
            printf 'ExecStart=\n'
            printf 'ExecStart=/usr/local/libexec/myownpki-agent-e2e.test -test.run=^TestNginxPort443InSystemdSandbox$ -test.v\n'
            printf 'Environment=MYOWNPKI_SYSTEMD_E2E=1\n'
          } | sudo tee /etc/systemd/system/myownpki-agent.service.d/99-ci.conf >/dev/null
          sudo install -d -m 0700 "$rootfs/var/lib/myownpki-agent"
          nginx_uid=$(awk -F: '$1 == "nginx" { print $3 }' "$rootfs/etc/passwd")
          nginx_gid=$(awk -F: '$1 == "nginx" { print $4 }' "$rootfs/etc/passwd")
          [ -n "$nginx_uid" ] && [ -n "$nginx_gid" ] || { echo '::error::nginx user missing in the pinned image'; exit 1; }
          for directory in body fastcgi proxy scgi uwsgi; do
            sudo install -d -m 0755 -o "$nginx_uid" -g "$nginx_gid" "$rootfs/var/lib/nginx/$directory"
          done
          for directory in client_temp fastcgi_temp proxy_temp scgi_temp uwsgi_temp; do
            sudo install -d -m 0755 -o "$nginx_uid" -g "$nginx_gid" "$rootfs/var/cache/nginx/$directory"
          done
          sudo systemctl daemon-reload
          # Negative control: without CAP_NET_BIND_SERVICE the same nginx test
          # must fail and its sanitized stderr must explain the missing right.
          sudo systemctl start myownpki-agent.service || true
          for _ in $(seq 1 30); do
            sudo systemctl is-active --quiet myownpki-agent.service || break
            sleep 1
          done
          result=$(systemctl show --property Result --value myownpki-agent.service)
          sudo journalctl -u myownpki-agent.service --no-pager -n 100 | tee "$RUNNER_TEMP/agent-no-low-ports.log" >/dev/null
          if [ "$result" = success ] || ! grep -Fq 'bind() to 0.0.0.0:443 failed (13: Permission denied)' "$RUNNER_TEMP/agent-no-low-ports.log"; then
            echo '::error::the sandbox test did not detect the missing low-port capability'
            cat "$RUNNER_TEMP/agent-no-low-ports.log"
            exit 1
          fi
          # Positive control: the packaged drop-in fixes exactly this failure.
          sudo install -m 0644 deploy/systemd/agent-low-ports.conf /etc/systemd/system/myownpki-agent.service.d/20-low-ports.conf
          sudo systemctl daemon-reload
          sudo systemctl reset-failed myownpki-agent.service
          if ! sudo systemctl start myownpki-agent.service; then
            sudo journalctl -u myownpki-agent.service --no-pager -n 100
            exit 1
          fi
          for _ in $(seq 1 30); do
            sudo systemctl is-active --quiet myownpki-agent.service || break
            sleep 1
          done
          result=$(systemctl show --property Result --value myownpki-agent.service)
          if [ "$result" != success ]; then
            sudo journalctl -u myownpki-agent.service --no-pager -n 100
            exit 1
          fi
          systemctl show --property Result --property ExecMainStatus myownpki-agent.service

  # The systemd installation for real (deploy/install.sh, docs/OPERATIONS.md
  # §2): a snapshot build, then test/install/systemd_test.sh as root on the
  # runner – first installation with --acme (ACME with its own TLS on :443,
  # the low-ports drop-in), systemd-analyze with the drop-in, second run,
  # init, start, health, CRL, an unseal through the API and ACME over TLS
  # with the root as trust anchor, an update that leaves the old binary
  # running (rolled back), the update with a second build, one more run, the
  # daily backup (timer, a run, verify, prune with --backup-keep). The
  # archive path stays relative: install.sh changes to / before it reads it.
  install:
    name: systemd installation (install.sh)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser takes the version from the last tag.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          goreleaser: "true"
      - name: Snapshot build (no SBOMs, no signatures, no image)
        run: goreleaser release --snapshot --clean --skip=sign,docker,sbom
      - name: install.sh functions (no root)
        run: bash test/install/functions_test.sh dist/myownpki_linux_amd64_v1/myownpki
      # A second binary with another version for the update path.
      - name: Second build for the update
        run: |
          go build -trimpath -o "$RUNNER_TEMP/update/myownpki" \
            -ldflags "-X github.com/Der-Felix/MyOwnPKI/internal/version.version=v0.2.1-ci.update" ./cmd/myownpki
      - name: Install, start, update (as root)
        run: |
          archive=$(find dist -maxdepth 1 -name 'myownpki_*_linux_amd64.tar.gz')
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_STEP_SUMMARY \
            bash test/install/systemd_test.sh "$archive" "$RUNNER_TEMP/update/myownpki"
      - name: Service log
        if: failure()
        run: sudo journalctl -u myownpki.service --no-pager -n 200
