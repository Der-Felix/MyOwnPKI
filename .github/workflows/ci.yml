# Continuous integration for MyOwnPKI.
#
# Security posture of this workflow:
# - read-only token (permissions: contents: read), no secrets used
# - third-party actions pinned to a full commit SHA (tags can be moved)
# - downloaded tools are verified against pinned SHA-256 checksums
# - GOTOOLCHAIN=local: CI never silently downloads a different Go version
#
# Pinned versions must match Taskfile.yml – `task tools:check` fails otherwise.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily vulnerability scan: new advisories appear without any code change.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Runs on main always finish; superseded runs of branches and PRs are cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GO_VERSION: "1.27.3"
  TASK_VERSION: "3.54.0"
  GOLANGCI_LINT_VERSION: "2.14.0"
  GOLANGCI_LINT_SHA256: "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab"
  SQLC_VERSION: "1.31.1"
  SQLC_SHA256: "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354"
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  VACUUM_VERSION: "0.30.6"
  VACUUM_SHA256: "179f038a71cd88721738d6c739dd07fbeebc905b48301935f2416e66aead95c6"
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  check:
    name: check (fmt, lint, test, build, generated code)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          golangci-lint: "true"
          sqlc: ${{ hashFiles('sqlc.yaml') != '' }}
      # The output also goes to a file: on a failure the next step turns the
      # failed tests into annotations, readable without signing in.
      - name: task check
        run: |
          set -o pipefail
          task check 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Failed tests as annotations
        if: failure()
        run: |
          if [ ! -s "$RUNNER_TEMP/test.log" ]; then exit 0; fi
          printf '### Failed tests – %s\n\n' "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/failed-tests.sh "$RUNNER_TEMP/test.log" "$GITHUB_STEP_SUMMARY"
      - run: task generate:check
      - name: Fuzz the ACME JWS parser (short run)
        run: task fuzz

  race:
    name: tests with race detector
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    env:
      # The race detector needs cgo (gcc is preinstalled on the runner). Only this
      # job – release binaries stay pure Go (ADR-01, verified by task build:verify).
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The output also goes to a file: on a failure the next step turns the
      # failed tests into annotations, readable without signing in.
      - name: task test:race
        run: |
          set -o pipefail
          task test:race 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Failed tests as annotations
        if: failure()
        run: |
          if [ ! -s "$RUNNER_TEMP/test.log" ]; then exit 0; fi
          printf '### Failed tests – %s\n\n' "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
          bash .github/scripts/failed-tests.sh "$RUNNER_TEMP/test.log" "$GITHUB_STEP_SUMMARY"

  test-os:
    name: tests on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum
      # macOS ships LibreSSL as /usr/bin/openssl; the tests need OpenSSL 3
      # (x509 -req -copy_extensions, as in the offline signing instructions).
      - name: OpenSSL 3 from Homebrew (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      # The tests cross-check certificates with `openssl verify` (required
      # in CI); the log shows which OpenSSL that is.
      - name: OpenSSL used by the tests
        shell: bash
        run: command -v openssl && openssl version
      - run: go test ./...

  cross:
    name: cross-compile (linux, darwin, windows, freebsd)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task cross

  vuln:
    name: vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task vuln

  lint-meta:
    name: workflows and API spec (actionlint, vacuum)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ShellCheck too: actionlint checks the run: scripts with it.
      - uses: ./.github/actions/setup
        with:
          shellcheck: "true"
          actionlint: "true"
          vacuum: "true"
      - run: task lint:ci
      - run: task lint:api

  shellcheck:
    name: legacy Bash suite (shellcheck, smoke test)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          shellcheck: "true"
      # The lib/*.sh modules share globals: a variable set in one module is
      # read in another. Checked one by one, every such variable looks
      # unused (SC2034), so the modules skip that check; the standalone
      # script contains all modules in one file and runs it for real.
      - name: ShellCheck sources and compiled standalone script
        run: |
          bash legacy/build.sh
          shellcheck --severity=warning --external-sources \
            legacy/*.sh legacy/tests/*.sh legacy/completions/*.bash \
            legacy/dist/pki-standalone.sh .github/scripts/*.sh test/conformance/run.sh
          shellcheck --severity=warning --exclude=SC2034 legacy/lib/*.sh
      - name: Smoke test (modular and standalone script, completion)
        run: bash legacy/tests/smoke.sh

  # Real ACME clients against the ACME server (PHASE2 step 14, owner Q5):
  # its own job because it runs containers (BIND, certbot, acme.sh) and binds
  # port 80. The images are pinned by digest in test/conformance/run.sh; lego
  # and Pebble by version in Taskfile.yml. Nothing of it reaches a release.
  conformance:
    name: ACME conformance (lego, certbot, acme.sh; Pebble as control)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Conformance run
        env:
          CONF_WORK: ${{ runner.temp }}/conformance
        run: task acme:conformance
