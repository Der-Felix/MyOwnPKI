# Release of MyOwnPKI – runs only when a v* tag is pushed (docs/RELEASING.md).
#
# GoReleaser (.goreleaser.yaml) builds the archives, checksums, SBOMs and the
# container image, signs the checksum file and the image keyless with cosign
# (Sigstore, GitHub OIDC – no key to keep), pushes the image to
# ghcr.io/der-felix/myownpki and creates a DRAFT release. The owner checks the
# draft and publishes it by hand.
#
# Security posture:
# - no permissions at the top; the one job gets exactly contents: write (the
#   draft release), packages: write (GHCR) and id-token: write (keyless signing)
# - actions pinned to a full commit SHA; tools downloaded with pinned SHA-256
#   (the checksum files of GoReleaser, cosign and syft were checked against
#   their Sigstore signatures when the pins were chosen)
# - the tagged commit must be on main; tests run before anything is built
# - no BuildKit container: Docker's containerd image store builds both
#   platforms (the Dockerfile has no RUN, so no emulation is needed either)

name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.27.3"
  GORELEASER_VERSION: "2.18.2"
  GORELEASER_SHA256: "0a96edc9d9bc594e4a41cc4d59467c182062910ab24d9d1f6dd7b667d32606d3"
  COSIGN_VERSION: "3.1.3"
  COSIGN_SHA256: "4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71"
  SYFT_VERSION: "1.54.1"
  SYFT_SHA256: "c069905b391cc4c20a5ba65ad5c10be2a7ba074f8ea6ad203e24d14e303dad47"
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"

jobs:
  release:
    name: draft release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs the history and the tags; no token in .git/config.
          fetch-depth: 0
          persist-credentials: false

      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main – tag a commit of main"
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Tests
        run: go test ./...

      - name: Install GoReleaser, cosign and syft
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin" "$RUNNER_TEMP/dl"
          cd "$RUNNER_TEMP/dl"
          curl -fsSL -o goreleaser.tar.gz \
            "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/goreleaser_Linux_x86_64.tar.gz"
          echo "${GORELEASER_SHA256}  goreleaser.tar.gz" | sha256sum -c -
          tar -xzf goreleaser.tar.gz goreleaser
          install -m 0755 goreleaser "$bin/"
          curl -fsSL -o cosign \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          install -m 0755 cosign "$bin/"
          curl -fsSL -o syft.tar.gz \
            "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          install -m 0755 syft "$bin/"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Docker with the containerd image store
        run: |
          if [ -s /etc/docker/daemon.json ]; then cfg=$(sudo cat /etc/docker/daemon.json); else cfg='{}'; fi
          echo "$cfg" | jq '.features["containerd-snapshotter"] = true' | sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          if ! docker info --format '{{json .DriverStatus}}' | grep -q 'io.containerd.snapshotter'; then
            echo "::error::Docker did not switch to the containerd image store"
            docker info
            exit 1
          fi
          docker version
          docker buildx version

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          # A pre-release tag (v0.1.0-rc.1) without its own section takes the
          # section of its base version ([0.1.0]).
          base="${v%%-*}"
          section() {
            # The section of version $1, without the link definitions at the end.
            awk -v head="## [$1]" 'index($0, head) == 1 { p = 1; next } p && /^## \[/ { exit } p && /^\[[^]]*\]: / { next } p' CHANGELOG.md
          }
          section "$v" > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" && [ "$base" != "$v" ]; then
            echo "No section [$v] in CHANGELOG.md – using [$base]"
            section "$base" > "$RUNNER_TEMP/notes.md"
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section \"## [$v]\" (nor \"## [$base]\")"
            exit 1
          fi

      - name: GoReleaser (draft release, image, signatures)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --release-notes "$RUNNER_TEMP/notes.md"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
