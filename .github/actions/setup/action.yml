# Shared setup for CI jobs: pinned Go toolchain, Task and optional tools.
# Versions and checksums come from the `env:` block in .github/workflows/ci.yml.
name: Set up Go and tools
description: Install the pinned Go toolchain, Task and optionally golangci-lint, sqlc, ShellCheck, actionlint, vacuum and GoReleaser

inputs:
  golangci-lint:
    description: Install golangci-lint ("true"/"false")
    default: "false"
  sqlc:
    description: Install sqlc ("true"/"false")
    default: "false"
  shellcheck:
    description: Install ShellCheck ("true"/"false")
    default: "false"
  actionlint:
    description: Install actionlint ("true"/"false")
    default: "false"
  vacuum:
    description: Install vacuum ("true"/"false")
    default: "false"
  goreleaser:
    description: Install GoReleaser ("true"/"false")
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache-dependency-path: go.sum

    # `go install` verifies the module against the Go checksum database.
    - name: Install Task
      shell: bash
      run: go install "github.com/go-task/task/v3/cmd/task@v${TASK_VERSION}"

    - name: Prepare tool directory
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: Install golangci-lint
      if: inputs.golangci-lint == 'true'
      shell: bash
      run: |
        f="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$f" \
          "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/$f"
        echo "${GOLANGCI_LINT_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/golangci-lint"
        tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/golangci-lint"
        install -m 0755 "$(find "$RUNNER_TEMP/golangci-lint" -type f -name golangci-lint)" "$RUNNER_TEMP/bin/"

    - name: Install sqlc
      if: inputs.sqlc == 'true'
      shell: bash
      run: |
        f="sqlc_${SQLC_VERSION}_linux_amd64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$f" \
          "https://github.com/sqlc-dev/sqlc/releases/download/v${SQLC_VERSION}/$f"
        echo "${SQLC_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/sqlc"
        tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/sqlc"
        install -m 0755 "$(find "$RUNNER_TEMP/sqlc" -type f -name sqlc)" "$RUNNER_TEMP/bin/"

    - name: Install ShellCheck
      if: inputs.shellcheck == 'true'
      shell: bash
      run: |
        f="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
        curl -fsSL -o "$RUNNER_TEMP/$f" \
          "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$f"
        echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/shellcheck"
        tar -xJf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/shellcheck"
        install -m 0755 "$(find "$RUNNER_TEMP/shellcheck" -type f -name shellcheck)" "$RUNNER_TEMP/bin/"

    - name: Install actionlint
      if: inputs.actionlint == 'true'
      shell: bash
      run: |
        f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$f" \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
        echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/actionlint"
        tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/actionlint"
        install -m 0755 "$(find "$RUNNER_TEMP/actionlint" -type f -name actionlint)" "$RUNNER_TEMP/bin/"

    - name: Install vacuum
      if: inputs.vacuum == 'true'
      shell: bash
      run: |
        f="vacuum_${VACUUM_VERSION}_linux_x86_64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$f" \
          "https://github.com/daveshanley/vacuum/releases/download/v${VACUUM_VERSION}/$f"
        echo "${VACUUM_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/vacuum"
        tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/vacuum"
        install -m 0755 "$(find "$RUNNER_TEMP/vacuum" -type f -name vacuum)" "$RUNNER_TEMP/bin/"

    - name: Install GoReleaser
      if: inputs.goreleaser == 'true'
      shell: bash
      run: |
        f="goreleaser_Linux_x86_64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$f" \
          "https://github.com/goreleaser/goreleaser/releases/download/v${GORELEASER_VERSION}/$f"
        echo "${GORELEASER_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/goreleaser"
        tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/goreleaser" goreleaser
        install -m 0755 "$RUNNER_TEMP/goreleaser/goreleaser" "$RUNNER_TEMP/bin/"
