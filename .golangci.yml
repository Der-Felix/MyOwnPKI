# golangci-lint v2 configuration – https://golangci-lint.run
# Pinned version: see GOLANGCI_LINT_VERSION in Taskfile.yml.
#
# Selection principle: every linter here either catches a class of real bugs or
# enforces a project rule (docs/PLAN.md, .claude/skills/myownpki). Pure style
# linters are left out on purpose – they create noise, not safety.

version: "2"

run:
  timeout: 5m
  # The conformance test (internal/acme, PHASE2 step 14) runs only in its CI
  # job, but is compiled and linted with everything else.
  build-tags: [conformance]

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # --- Security (this program signs certificates) ---
    - gosec         # weak crypto, weak randomness, file permissions, decompression bombs …
    - bidichk       # "Trojan Source": invisible Unicode that makes code read differently than it runs
    - asciicheck    # non-ASCII identifiers (look-alike characters)
    - depguard      # forbidden packages, see settings below
    - forbidigo     # forbidden functions, see settings below
    - noctx         # outgoing HTTP without context = no timeout/cancel (ACME, http-01 checks)
    - bodyclose     # unclosed HTTP bodies leak connections
    - sqlclosecheck # unclosed SQL rows/statements
    - rowserrcheck  # forgotten rows.Err() hides database errors
    - gomoddirectives # no `replace` in go.mod – dependencies come from the public, verified proxy

    # --- Error handling (go-conventions.md "Errors") ---
    - errorlint     # use errors.Is/As and %w, so wrapped errors can still be matched
    - errname       # ErrSomething / SomethingError naming
    - nilerr        # returning nil although an error was checked
    - nilnesserr    # returning the wrong error variable

    # --- Correctness ---
    - exhaustive    # switch over an enum (key type, revocation reason, status) must handle every value
    - forcetypeassert
    - durationcheck
    - makezero
    - reassign
    - unconvert
    - gocritic
    - sloglint      # structured logging rules (go-conventions.md "Logging")
    - usestdlibvars
    - misspell
    - contextcheck  # a function that has a context must hand it on; a detached one (a check that outlives its request) needs a //nolint with the reason
    - containedctx  # a context in a struct hides who cancels it; the few lifetime contexts (validator, scanner) say so in a //nolint
    - errchkjson    # an ignored json.Marshal error leaves an empty body that a test can mistake for "absent"
    - wastedassign  # a value assigned and overwritten before it is read hides a branch that forgot to set it
    - recvcheck     # mixed value and pointer receivers; the few deliberate ones (redaction on a copy, wipe on the original) say so in a //nolint
    - unparam       # a parameter nobody reads or a result nobody uses is a leftover of a change; "always receives" is not reported (see exclusions)
    - intrange      # for i := range n, as the language has it since Go 1.22
    - perfsprint    # fmt.Errorf without a verb is errors.New (go-conventions.md "Errors"); plus strconv for plain numbers
    - mirror        # bytes/strings twins that allocate for nothing (strings.Contains(string(b), s))
    - canonicalheader # header names are written in the form net/http sends them
    - dogsled       # three or more blank identifiers in one assignment hide what a call returns
    - fatcontext    # a context that grows inside a loop
    - revive        # only the rules below: error-strings, error-naming, redefines-builtin-id (max, real, clear), context-as-argument, package-comments

    # --- Tests ---
    - usetesting
    - tparallel
    - thelper

    # --- Hygiene ---
    - nolintlint    # every //nolint must name the linter and say why
    - dupl          # copied blocks of 100 tokens or more drift apart; tests are excluded (see settings, exclusions)

  settings:
    errcheck:
      check-type-assertions: true

    govet:
      enable-all: true
      disable:
        - fieldalignment # memory layout micro-optimisation, hurts readability

    exhaustive:
      # A `default:` branch counts as handling the rest – it must then reject, not ignore.
      default-signifies-exhaustive: true

    sloglint:
      attr-only: true        # slog.String("ca", name) – never loose key/value pairs
      static-msg: true       # message is a constant; variable data goes into attributes
      key-naming-case: snake

    misspell:
      locale: US             # ADR-17: English, US spelling

    perfsprint:
      strconcat: false       # "use + instead of Sprintf" is a style rewrite, not a fix
      concat-loop: false     # a few short loops in tools and test servers; no hot path

    revive:
      enable-all-rules: false   # the default rules are style; these five are not
      rules:
        - name: error-strings          # go-conventions.md "Errors": lower case, no punctuation at the end
        - name: error-naming           # ErrFoo for values, FooError for types
        - name: redefines-builtin-id   # a parameter called max or clear hides the builtin for the rest of the function
        - name: context-as-argument    # the context is the first parameter (after the test handle)
          arguments:
            - allowTypesBefore: "*testing.T,testing.TB"
        - name: package-comments       # every package says what it is for

    nolintlint:
      require-explanation: true
      require-specific: true

    dupl:
      threshold: 100         # tokens; the default 150 finds nothing in this tree, 100 found the two pairs fixed in step 92

    depguard:
      rules:
        all:
          list-mode: lax     # everything allowed except the deny list
          deny:
            - pkg: math/rand
              desc: "use crypto/rand – serials, nonces and tokens must be unpredictable"
            - pkg: math/rand/v2
              desc: "use crypto/rand – serials, nonces and tokens must be unpredictable"
            - pkg: github.com/mattn/go-sqlite3
              desc: "needs CGO – use modernc.org/sqlite (ADR-01, ADR-06)"
            - pkg: gopkg.in/yaml.v2
              desc: "use go.yaml.in/yaml/v3"
            - pkg: gopkg.in/yaml.v3
              desc: "archived upstream – use go.yaml.in/yaml/v3"
            - pkg: github.com/pkg/errors
              desc: "use fmt.Errorf with %w and errors.Is/As"
            - pkg: log$
              desc: "use log/slog (structured, redactable)"
            # Weak cryptography: gosec already blocks md5, sha1, des, rc4, md4 and
            # ripemd160 (G501–G507). Only what gosec doesn't cover is listed here.
            - pkg: crypto/dsa
              desc: "DSA is deprecated and not allowed by the CA/Browser Forum – use ECDSA, Ed25519 or RSA"
            - pkg: golang.org/x/crypto/pkcs12
              desc: "decode-only and frozen – pick a maintained PKCS#12 library (ask first, ADR-14)"
            - pkg: golang.org/x/crypto/openpgp
              desc: "unmaintained and unsafe by design (GO-2026-5932) – not needed by a PKI"
        # dns-01 lives in the agent only (docs/PHASE3.md §13.3). The server
        # never answers a DNS challenge and must not carry the ACME client
        # library or the DNS library; cmd/myownpki/deps_test.go checks the
        # built binaries (indirect imports included).
        agent-only-dns:
          list-mode: lax
          files:
            - "!$test"
            - "!**/internal/agent/**"
            - "!**/cmd/myownpki-agent/**"
            - "!**/internal/testutil/**"
          deny:
            - pkg: github.com/go-acme/lego
              desc: "the ACME client library belongs to the agent (internal/agent) – the server must not carry it (docs/PHASE3.md §13.3)"
            - pkg: github.com/miekg/dns
              desc: "the DNS library belongs to the agent and to internal/testutil/dnsserver – the server must not carry it (docs/PHASE3.md §13.3)"

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^time\.Now$
          msg: "inject a clock (interface{ Now() time.Time }) so validity and renewal tests control time"
        - pattern: ^(fmt\.Print(f|ln)?|print|println)$
          msg: "use log/slog, or write to an injected io.Writer"

  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests may read the wall clock (e.g. to build fixtures relative to now).
      - path: _test\.go
        linters: [forbidigo]
        text: time\.Now
      # Table tests and fixtures repeat on purpose; a shared helper there would hide what each case does.
      - path: _test\.go
        linters: [dupl]
      # "always receives" is a design remark (a parameter kept for the second caller),
      # not a leftover; unused parameters and unused results are still reported.
      - linters: [unparam]
        text: always receives
      # The package comment of trust lives in trust.templ; revive does not read the generated file.
      - path: internal/web/pages/trust/trust[.]go
        linters: [revive]
        text: package-comments

issues:
  # Report every finding. The defaults cap equal messages at 3 and a linter at 50,
  # which would hide the rest when a linter is switched on.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    goimports:
      local-prefixes:
        - github.com/Der-Felix/MyOwnPKI
