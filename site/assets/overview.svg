<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 500" role="img" aria-labelledby="overview-title overview-desc">
<title id="overview-title">How the parts of MyOwnPKI fit together</title>
<desc id="overview-desc">Browsers and API clients reach the web UI and REST API of the server over HTTPS. ACME clients, and the agent on a host, get certificates from the ACME server. The agent also reports to the agent listener and deploys the certificate to a service such as nginx. The server holds the certificate authorities. From the server, alerts go out by e-mail or webhook, the TLS scan connects to your TLS endpoints, and backups are written to backup storage.</desc>
