server: https://pki.homelab.lan:8444
ca_bundle: "@ROOT@/etc/root.pem"
hostname: proxy1.homelab.lan
acme_directory: https://pki.homelab.lan/acme/directory
state_dir: "@ROOT@/state"
enrollment:
  challenge: standalone
hooks:
  mail-reload: ["@ROOT@/bin/systemctl", "reload", "postfix"]
  imap-reload: ["@ROOT@/bin/systemctl", "reload", "dovecot"]
paths:
  - "@ROOT@/www"
  - "@ROOT@/mail"
sandbox:
  write:
    - "@ROOT@/log-a"
    - "@ROOT@/log-b"
  low_ports: true
deployments:
  - name: mail
    profile: file
    names: [mail.homelab.lan]
    challenge: standalone
    files:
      fullchain: "@ROOT@/mail/fullchain.pem"
      key: "@ROOT@/mail/privkey.pem"
    reload_hook: mail-reload
  - name: imap
    profile: file
    names: [proxy1.homelab.lan]
    challenge: standalone
    files:
      fullchain: "@ROOT@/mail/imap/fullchain.pem"
      key: "@ROOT@/mail/imap/privkey.pem"
    owner: root
    group: root
    key_mode: "0640"
    reload_hook: imap-reload
