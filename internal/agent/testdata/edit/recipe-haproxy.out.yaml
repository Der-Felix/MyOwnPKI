# Written by myownpki-agent setup; this file is preserved on later runs.
server: "https://pki.homelab.lan:8444"
ca_bundle: "@ROOT@/etc/root.pem"
hostname: "proxy1.homelab.lan"
acme_directory: "https://pki.homelab.lan/acme/directory"
state_dir: "@ROOT@/state"
log_level: "info"
enrollment:
  challenge: "webroot"
  webroot: "@ROOT@/www"
hooks:
  haproxy-test: ["@ROOT@/usr/sbin/haproxy", "-c", "-f", "@ROOT@/etc/haproxy/haproxy.cfg"]
  haproxy-reload: ["@ROOT@/usr/bin/systemctl", "reload", "haproxy"]
paths: ["@ROOT@/www", "@ROOT@/etc/ssl/myownpki/haproxy"]
deployments:
  - name: "test"
    profile: "file"
    names: ["proxy.homelab.lan"]
    challenge: "webroot"
    webroot: "@ROOT@/www"
    files:
      combined: "@ROOT@/etc/ssl/myownpki/haproxy/test.pem"
    owner: "root"
    group: "root"
    key_mode: "0600"
    test_hook: "haproxy-test"
    reload_hook: "haproxy-reload"
    check: "127.0.0.1:443"
